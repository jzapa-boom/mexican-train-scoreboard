              navigate('setup');
            }} style={{...btnStyle(selectedSquad?`linear-gradient(135deg, ${C.coral}, ${C.pink})`:"#ddd"),width:"100%",fontSize:16,padding:"16px",borderRadius:50,display:"flex",alignItems:"center",justifyContent:"center",gap:10,cursor:selectedSquad?"pointer":"not-allowed"}}>
              <IconTrain size={20} color="#fff"/> {selectedSquad?`Start Game with ${selectedSquad.name}`:"Select a squad to start"}
            </button>
          </BottomBar>
        )}
      </Screen>
    );
  }

  // ── SQUAD EDIT ─────────────────────────────────────────────────────────────
  if(screen==="squadedit"&&editingSquad){
    // saveSquads -> saveSquadsLS
    const isNew=!squads.find(s=>s.id===editingSquad.id);
    const inSquad=editingSquad.members||[];
    const notInSquad=allPlayers.filter(p=>!inSquad.includes(p.name));
    return(
      <Screen style={{background:C.bg}}>
        <div style={{background:GR.profile,padding:"calc(env(safe-area-inset-top) + 16px) 18px 14px"}}>
          <button onClick={()=>goBack()} style={{background:"rgba(255,255,255,0.22)",border:"none",color:"#fff",width:38,height:38,borderRadius:"50%",fontSize:18,cursor:"pointer",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
          <div style={{fontFamily:"'Fredoka One',cursive",fontSize:26,color:"#fff",lineHeight:1}}>{isNew?"New Squad":"Edit Squad"}</div>
        </div>
        <ColorBar colors={skin.bar}/>
        <div style={{padding:"12px 14px",paddingBottom:"calc(90px + env(safe-area-inset-bottom))"}}>
          <div style={{background:"#fff",borderRadius:16,padding:"16px",marginBottom:14,boxShadow:"0 2px 8px rgba(0,0,0,0.05)"}}>
            <div style={{fontSize:11,fontWeight:800,color:C.muted,textTransform:"uppercase",marginBottom:8}}>Squad Name</div>
            <input value={editingSquad.name} onChange={e=>setEditingSquad(prev=>({...prev,name:e.target.value}))}
              style={{width:"100%",padding:"12px 14px",borderRadius:12,border:`2px solid ${C.sky}55`,fontSize:16,fontFamily:"'Nunito',sans-serif",outline:"none",boxSizing:"border-box"}}/>
          </div>
          {inSquad.length>0&&(
            <div style={{background:"#fff",borderRadius:16,padding:"16px",marginBottom:14,boxShadow:"0 2px 8px rgba(0,0,0,0.05)"}}>
              <div style={{fontSize:11,fontWeight:800,color:C.muted,textTransform:"uppercase",marginBottom:10}}>Members</div>
              {inSquad.map((name,i)=>(
                <div key={name} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                  <Avatar name={name} idx={i} size={36}/>
                  <div style={{flex:1,fontWeight:700,fontSize:15,color:C.dark}}>{name}</div>
                  <button onClick={()=>setEditingSquad(prev=>({...prev,members:prev.members.filter(m=>m!==name)}))}
                    style={{background:`${C.coral}18`,border:`1px solid ${C.coral}55`,borderRadius:8,padding:"5px 10px",cursor:"pointer",color:C.coral,fontSize:12,fontWeight:800,fontFamily:"'Nunito',sans-serif"}}>− Remove</button>
                </div>
              ))}
            </div>
          )}
          {notInSquad.length>0&&(
            <div style={{background:"#fff",borderRadius:16,padding:"16px",marginBottom:14,boxShadow:"0 2px 8px rgba(0,0,0,0.05)"}}>
              <div style={{fontSize:11,fontWeight:800,color:C.muted,textTransform:"uppercase",marginBottom:10}}>Add Players</div>
              {notInSquad.map((pl,i)=>(
                <div key={pl.id||i} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                  <Avatar name={pl.name} idx={pl.avatarIdx??i} size={36} emoji={pl.avatarEmoji||null} photo={pl.avatarPhoto||null} color={pl.avatarColor||null}/>
                  <div style={{flex:1,fontWeight:700,fontSize:15,color:C.dark}}>{pl.name}</div>
                  <button onClick={()=>setEditingSquad(prev=>({...prev,members:[...prev.members,pl.name]}))}
                    style={{background:`${C.teal}18`,border:`1px solid ${C.teal}55`,borderRadius:8,padding:"5px 10px",cursor:"pointer",color:C.teal,fontSize:12,fontWeight:800,fontFamily:"'Nunito',sans-serif"}}>+ Add</button>
                </div>
              ))}
            </div>
          )}
          {!isNew&&(
            <button onClick={()=>{
              const updated=squads.filter(s=>s.id!==editingSquad.id);
              saveSquadsLS(updated);
              setEditingSquad(null);
              goBack();
            }} style={{width:"100%",padding:"13px",borderRadius:14,border:`1.5px solid ${C.coral}55`,background:"transparent",color:C.coral,fontSize:14,fontWeight:800,fontFamily:"'Nunito',sans-serif",cursor:"pointer",marginTop:4}}>Delete Squad</button>
          )}
        </div>
        <BottomBar>
          <button onClick={()=>{
            // saveSquads2 -> saveSquadsLS
            const updated=isNew?[...squads,editingSquad]:squads.map(s=>s.id===editingSquad.id?editingSquad:s);
            saveSquadsLS(updated);
            setEditingSquad(null);
            goBack();
          }} style={{...btnStyle(`linear-gradient(135deg, ${C.teal}, #1a5f82)`),width:"100%",fontSize:16,padding:"16px",borderRadius:50,display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
            Save Squad
          </button>
        </BottomBar>
      </Screen>
    );
  }

  // ── PLAYER PROFILE ─────────────────────────────────────────────────────────
  if(screen==="profile"&&viewingPlayer){
    const pl=viewingPlayer;
    const plSquads=squads.filter(s=>s.members?.includes(pl.name));
    const avgScore=pl.gamesPlayed>0?Math.round((pl.totalScore||0)/pl.gamesPlayed):0;
    const pIdx=pl.avatarIdx??0;
    const earned=TITLE_BADGES.filter(b=>b.check(pl));
    const locked=TITLE_BADGES.filter(b=>!b.check(pl));
    const tabs=[['history','History'],['badges','Badges'],['customize','Customize']];
    return(
      <Screen style={{background:C.bg,display:"flex",flexDirection:"column",height:"100dvh",overflow:"hidden"}}>
        {/* Header */}
        <div style={{background:GR.profile,padding:"calc(env(safe-area-inset-top) + 14px) 18px 14px",flexShrink:0}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <button onClick={()=>{setIsEditingProfile(false);setEditingProfile(null);goBack();}} style={{background:"rgba(255,255,255,0.22)",border:"none",color:"#fff",width:38,height:38,borderRadius:"50%",fontSize:18,cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
            <Avatar name={pl.name} idx={pIdx} size={44} emoji={pl.avatarEmoji||null} photo={pl.avatarPhoto||null} color={pl.avatarColor||null}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontFamily:"'Fredoka One',cursive",fontSize:22,color:"#fff",lineHeight:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{pl.name}</div>
              {pl.tagline
                ?<div style={{color:"rgba(255,255,255,0.75)",fontSize:12,marginTop:2}}>{pl.tagline}</div>
                :plSquads.length>0&&<div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:3}}>{plSquads.map(s=><Badge key={s.id} label={s.name} bg="rgba(255,255,255,0.25)"/>)}</div>
              }
            </div>
          </div>
        </div>
        <ColorBar colors={skin.bar}/>

        {/* Stats bar — always visible */}
        <div style={{background:"#fff",borderBottom:"1px solid #f0f0f0",flexShrink:0}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)"}}>
            {[["Games",pl.gamesPlayed||0],["Wins",pl.wins||0],["Avg Score",avgScore]].map(([label,val],i)=>(
              <div key={label} style={{padding:"12px 10px",textAlign:"center",borderRight:i<2?"1px solid #f0f0f0":"none"}}>
                <div style={{fontFamily:"'Fredoka One',cursive",fontSize:24,color:C.dark,lineHeight:1}}>{val}</div>
                <div style={{fontSize:11,color:C.muted,fontWeight:700,marginTop:3}}>{label}</div>
              </div>
            ))}
          </div>
          {(pl.winStreak||0)>0&&(
            <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 16px",borderTop:"1px solid #f0f0f0"}}>
              <span style={{fontSize:16}}>🔥</span>
              <span style={{fontSize:12,fontWeight:800,color:C.dark}}>{pl.winStreak} win streak</span>
              {pl.bestStreak>pl.winStreak&&<span style={{fontSize:11,color:C.muted}}>· best: {pl.bestStreak}</span>}
            </div>
          )}
        </div>

        {/* Tab nav */}
        <div style={{background:"#fff",borderBottom:"1px solid #eee",display:"flex",flexShrink:0,position:"sticky",top:0,zIndex:10}}>
          {tabs.map(([key,label])=>{
            const active=profileTab===key;
            return(
              <button key={key} onClick={()=>setProfileTab(key)} style={{flex:1,padding:"13px 4px",border:"none",background:"none",cursor:"pointer",fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:13,color:active?"#6c3fbf":C.muted,borderBottom:active?"3px solid #6c3fbf":"3px solid transparent",transition:"color 0.15s"}}>
                {label}
              </button>
            );
          })}
        </div>

        {/* Live preview — only on Customize tab */}
        {profileTab==='customize'&&(
          <div style={{background:"#fff",borderBottom:"1px solid #f0f0f0",padding:"16px 18px",display:"flex",alignItems:"center",gap:14,flexShrink:0}}>
            <Avatar name={isEditingProfile?editingProfile.name:pl.name} idx={pIdx} size={56}
              emoji={(isEditingProfile?editingProfile:pl).avatarEmoji||null}
              photo={(isEditingProfile?editingProfile:pl).avatarPhoto||null}
              color={(isEditingProfile?editingProfile:pl).avatarColor||null}/>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontFamily:"'Fredoka One',cursive",fontSize:20,color:C.dark,lineHeight:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                {isEditingProfile?editingProfile.name:pl.name}
              </div>
              <div style={{fontSize:12,color:C.muted,marginTop:2}}>
                {isEditingProfile?(editingProfile.tagline||"No tagline"):(pl.tagline||"No tagline")}
              </div>
            </div>
            {isEditingProfile
              ?<button onClick={()=>{setIsEditingProfile(false);setEditingProfile(null);}}
                  style={{background:"none",border:`1.5px solid #ddd`,borderRadius:50,padding:"8px 14px",color:C.muted,fontSize:13,fontWeight:800,fontFamily:"'Nunito',sans-serif",cursor:"pointer",flexShrink:0}}>
                  Cancel
                </button>
              :<button onClick={()=>{setEditingProfile({...pl});setIsEditingProfile(true);}}
                  style={{...btnStyle(GR.profile),padding:"10px 16px",fontSize:13,borderRadius:50,flexShrink:0}}>
                  Edit
                </button>
            }
          </div>
        )}

        {/* Tab content */}
        <div style={{flex:1,overflowY:"auto",padding:"12px 14px",paddingBottom:"calc(90px + env(safe-area-inset-bottom))"}}>

          {/* ── HISTORY TAB ── */}
          {profileTab==='history'&&(
            <div>
              <div style={{background:"#fff",borderRadius:16,overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,0.05)",marginBottom:12}}>
                <div style={{padding:"12px 16px",borderBottom:"1px solid #f0f0f0"}}>
                  <div style={{fontSize:11,fontWeight:800,color:C.muted,textTransform:"uppercase",letterSpacing:0.5}}>Recent Games</div>
                </div>
                {(pl.gameHistory||[]).length===0&&(
                  <div style={{textAlign:"center",padding:"24px",color:C.muted,fontSize:13}}>No games recorded yet.</div>
                )}
                {(pl.gameHistory||[]).slice(-10).reverse().map((g,i,arr)=>{
                  const isWin=g.placement===1;
                  const canView=!!g.scores;
                  return(
                    <div key={i} onClick={canView?()=>{
                      setGameData({players:g.players,scores:g.scores,startPip:g.startPip??12,currentRound:0,status:"done"});
                      setGameCode(g.gameCode||"");
                      setMyName(pl.name);
                      navigate("fullboard");
                    }:undefined}
                    style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 16px",borderBottom:i<arr.length-1?"1px solid #f0f0f0":"none",cursor:canView?"pointer":"default"}}>
                      <div>
                        <div style={{display:"flex",alignItems:"center",gap:6}}>
                          <div style={{fontWeight:700,fontSize:14,color:C.dark}}>#{g.placement} of {g.players?.length}</div>
                          {g.squadName&&<span style={{background:`${C.teal}18`,color:C.teal,borderRadius:50,padding:"1px 7px",fontSize:10,fontWeight:800}}>{g.squadName}</span>}
                          {isWin&&<span style={{fontSize:12}}>🏆</span>}
                        </div>
                        <div style={{fontSize:11,color:C.muted,marginTop:1}}>
                          {new Date(g.date).toLocaleDateString()}
                          {g.players&&<span style={{color:"#ccc"}}> · {g.players.join(", ")}</span>}
                          {canView&&<span style={{color:C.sky,marginLeft:6}}>View →</span>}
                        </div>
                      </div>
                      <div style={{fontFamily:"'Fredoka One',cursive",fontSize:22,color:isWin?C.gold:C.dark,flexShrink:0}}>{g.myScore} pts</div>
                    </div>
                  );
                })}
              </div>
              {/* Squads */}
              <div style={{background:"#fff",borderRadius:16,overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,0.05)"}}>
                <div style={{padding:"12px 16px",borderBottom:"1px solid #f0f0f0"}}>
                  <div style={{fontSize:11,fontWeight:800,color:C.muted,textTransform:"uppercase",letterSpacing:0.5}}>My Squads</div>
                </div>
                {plSquads.length===0
                  ?<div style={{textAlign:"center",padding:"20px",color:C.muted,fontSize:13}}>Not in any squads yet.</div>
                  :plSquads.map((sq,i)=>(
                    <div key={sq.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 16px",borderBottom:i<plSquads.length-1?"1px solid #f0f0f0":"none"}}>
                      <div>
                        <div style={{fontWeight:700,fontSize:14,color:C.dark}}>{sq.name}</div>
                        <div style={{fontSize:11,color:C.muted,marginTop:1}}>{sq.members?.join(", ")}</div>
                      </div>
                      <div style={{fontSize:11,color:C.muted,fontWeight:700}}>{sq.members?.length} players</div>
                    </div>
                  ))
                }
              </div>
            </div>
          )}

          {/* ── BADGES TAB ── */}
          {profileTab==='badges'&&(
            <div>
              {earned.length>0&&(
                <div style={{background:"#fff",borderRadius:16,overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,0.05)",marginBottom:12}}>
                  <div style={{padding:"12px 16px",borderBottom:"1px solid #f0f0f0"}}>
                    <div style={{fontSize:11,fontWeight:800,color:C.muted,textTransform:"uppercase",letterSpacing:0.5}}>Earned · {earned.length}</div>
                  </div>
                  {earned.map((b,i)=>(
                    <div key={b.id} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",borderBottom:i<earned.length-1?"1px solid #f0f0f0":"none"}}>
                      <div style={{width:40,height:40,borderRadius:"50%",background:`${C.teal}18`,border:`1.5px solid ${C.teal}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>{b.icon}</div>
                      <div>
                        <div style={{fontWeight:800,fontSize:14,color:C.teal}}>{b.name}</div>
                        <div style={{fontSize:12,color:C.muted,marginTop:1}}>{b.desc}</div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
              {locked.length>0&&(
                <div style={{background:"#fff",borderRadius:16,overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,0.05)"}}>
                  <div style={{padding:"12px 16px",borderBottom:"1px solid #f0f0f0"}}>
                    <div style={{fontSize:11,fontWeight:800,color:C.muted,textTransform:"uppercase",letterSpacing:0.5}}>Locked · {locked.length}</div>
                  </div>
                  {locked.map((b,i)=>(
                    <div key={b.id} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",borderBottom:i<locked.length-1?"1px solid #f0f0f0":"none",opacity:0.45}}>
                      <div style={{width:40,height:40,borderRadius:"50%",background:"#f5f5f5",border:"1.5px solid #eee",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>{b.icon}</div>
                      <div>
                        <div style={{fontWeight:800,fontSize:14,color:C.dark}}>{b.name}</div>
                        <div style={{fontSize:12,color:C.muted,marginTop:1}}>{b.desc}</div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
              {earned.length===0&&locked.length===0&&(
                <div style={{textAlign:"center",padding:"40px 20px",color:C.muted,fontSize:14}}>No badges available yet.</div>
              )}
            </div>
          )}

          {/* ── CUSTOMIZE TAB ── */}
          {profileTab==='customize'&&(
            <div>
              {/* Identity */}
              <div style={{background:"#fff",borderRadius:16,overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,0.05)",marginBottom:12}}>
                <div style={{padding:"10px 16px",borderBottom:"1px solid #f0f0f0"}}>
                  <div style={{fontSize:11,fontWeight:800,color:C.muted,textTransform:"uppercase",letterSpacing:0.5}}>Identity</div>
                </div>
                <div style={{padding:"0 16px"}}>
                  <div style={{borderBottom:"1px solid #f0f0f0",padding:"10px 0"}}>
                    <div style={{fontSize:10,color:C.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:0.5,marginBottom:3}}>Display name</div>
                    {isEditingProfile
                      ?<input value={editingProfile.name} onChange={e=>setEditingProfile(prev=>({...prev,name:e.target.value}))}
                          style={{width:"100%",fontSize:16,border:"none",outline:"none",fontFamily:"'Nunito',sans-serif",color:C.dark,background:"transparent",fontWeight:700}}/>
                      :<div style={{fontSize:15,color:C.dark,fontWeight:700}}>{pl.name}</div>
                    }
                  </div>
                  <div style={{padding:"10px 0"}}>
                    <div style={{fontSize:10,color:C.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:0.5,marginBottom:3}}>Tagline</div>
                    {isEditingProfile
                      ?<input value={editingProfile.tagline||""} onChange={e=>setEditingProfile(prev=>({...prev,tagline:e.target.value}))}
                          placeholder="e.g. Always loses on 12"
                          style={{width:"100%",fontSize:13,border:"none",outline:"none",fontFamily:"'Nunito',sans-serif",color:C.muted,background:"transparent"}}/>
                      :<div style={{fontSize:13,color:pl.tagline?C.dark:C.muted}}>{pl.tagline||"None set"}</div>
                    }
                  </div>
                </div>
              </div>

              {/* Avatar color */}
              <div style={{background:"#fff",borderRadius:16,overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,0.05)",marginBottom:12}}>
                <div style={{padding:"10px 16px",borderBottom:"1px solid #f0f0f0"}}>
                  <div style={{fontSize:11,fontWeight:800,color:C.muted,textTransform:"uppercase",letterSpacing:0.5}}>Avatar Color</div>
                </div>
                <div style={{padding:"12px 16px"}}>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                    {AVATAR_COLORS.map((c,i)=>(
                      <div key={c} onClick={isEditingProfile?()=>setEditingProfile(prev=>({...prev,avatarColor:c,avatarIdx:i})):undefined}
                        style={{width:30,height:30,borderRadius:"50%",background:c,cursor:isEditingProfile?"pointer":"default",
                          border:`3px solid ${((isEditingProfile?editingProfile:pl).avatarColor===c||(!((isEditingProfile?editingProfile:pl).avatarColor)&&i===pIdx))?"#333":"transparent"}`,
                          boxSizing:"border-box",transform:isEditingProfile&&(editingProfile?.avatarColor===c)?"scale(1.2)":"scale(1)",transition:"transform 0.1s"}}/>
                    ))}
                  </div>
                  {!isEditingProfile&&<div style={{marginTop:10,fontSize:12,color:C.muted}}>Tap <strong>Edit</strong> above to change.</div>}
                </div>
              </div>

              {/* Emoji picker — only when editing */}
              {isEditingProfile&&(
                <div style={{background:"#fff",borderRadius:16,overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,0.05)",marginBottom:12}}>
                  <div style={{padding:"10px 16px",borderBottom:"1px solid #f0f0f0"}}>
                    <div style={{fontSize:11,fontWeight:800,color:C.muted,textTransform:"uppercase",letterSpacing:0.5}}>Emoji <span style={{fontSize:11,color:C.muted,fontWeight:400,textTransform:"none",letterSpacing:0}}>(replaces initials)</span></div>
                  </div>
                  <div style={{padding:"12px 16px"}}>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(8,1fr)",gap:6,marginBottom:10}}>
                      {AVATAR_EMOJIS.map(em=>(
                        <div key={em} onClick={()=>setEditingProfile(prev=>({...prev,avatarEmoji:prev.avatarEmoji===em?null:em,avatarPhoto:null}))}
                          style={{width:36,height:36,borderRadius:"50%",background:editingProfile.avatarEmoji===em?`${C.teal}22`:"#f5f5f5",
                            border:`2px solid ${editingProfile.avatarEmoji===em?C.teal:"transparent"}`,
                            display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,cursor:"pointer"}}>
                          {em}
                        </div>
                      ))}
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:10}}>
                      <div style={{fontSize:12,color:C.muted,flexShrink:0}}>Or type any:</div>
                      <input value={editingProfile.avatarEmoji||""} onChange={e=>{const v=e.target.value.slice(-2);setEditingProfile(prev=>({...prev,avatarEmoji:v||null,avatarPhoto:null}));}}
                        placeholder="✨"
                        style={{width:52,fontSize:22,textAlign:"center",border:`1.5px solid #eee`,borderRadius:10,padding:"4px 6px",outline:"none",fontFamily:"sans-serif"}}/>
                      {editingProfile.avatarEmoji&&<button onClick={()=>setEditingProfile(prev=>({...prev,avatarEmoji:null}))}
                        style={{background:"none",border:"none",color:C.muted,fontSize:13,cursor:"pointer",fontFamily:"'Nunito',sans-serif"}}>Clear</button>}
                    </div>
                  </div>
                </div>
              )}

              {/* Photo upload — only when editing */}
              {isEditingProfile&&(
                <div style={{background:"#fff",borderRadius:16,overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,0.05)",marginBottom:12}}>
                  <div style={{padding:"10px 16px",borderBottom:"1px solid #f0f0f0",display:"flex",alignItems:"center",gap:8}}>
                    <div style={{fontSize:11,fontWeight:800,color:C.muted,textTransform:"uppercase",letterSpacing:0.5}}>Photo</div>
                    <span style={{fontSize:10,background:C.gold,color:C.dark,borderRadius:50,padding:"1px 7px",fontWeight:800}}>Game Night+</span>
                  </div>
                  <div style={{padding:"12px 16px"}}>
                    <input ref={photoRef} type="file" accept="image/*" onChange={async e=>{
                      const file=e.target.files?.[0]; if(!file) return;
                      const reader=new FileReader();
                      reader.onload=()=>setEditingProfile(prev=>({...prev,avatarPhoto:reader.result,avatarEmoji:null}));
                      reader.readAsDataURL(file); e.target.value="";
                    }} style={{display:"none"}}/>
                    {editingProfile.avatarPhoto
                      ?<div style={{display:"flex",alignItems:"center",gap:10}}>
                          <img src={editingProfile.avatarPhoto} style={{width:48,height:48,borderRadius:"50%",objectFit:"cover",border:`2px solid ${C.teal}`}} alt="avatar"/>
                          <button onClick={()=>photoRef.current.click()} style={{padding:"7px 14px",borderRadius:50,border:`1.5px solid ${C.sky}`,background:"transparent",color:C.sky,fontSize:13,fontWeight:800,fontFamily:"'Nunito',sans-serif",cursor:"pointer"}}>Change</button>
                          <button onClick={()=>setEditingProfile(prev=>({...prev,avatarPhoto:null}))} style={{padding:"7px 14px",borderRadius:50,border:"1.5px solid #eee",background:"transparent",color:C.muted,fontSize:13,fontWeight:800,fontFamily:"'Nunito',sans-serif",cursor:"pointer"}}>Remove</button>
                        </div>
                      :<button onClick={()=>isPro?photoRef.current.click():navigate("upgrade")}
                          style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderRadius:12,border:`1.5px solid ${isPro?C.sky:"#eee"}`,background:`${isPro?C.sky:"#f5f5f5"}11`,cursor:"pointer",width:"100%",fontFamily:"'Nunito',sans-serif"}}>
                          <IconCamera size={20} color={isPro?C.sky:C.muted}/>
                          <div style={{textAlign:"left"}}>
                            <div style={{fontSize:13,fontWeight:800,color:isPro?C.sky:C.muted}}>{isPro?"Upload a photo":"Unlock with Game Night+"}</div>
                            <div style={{fontSize:11,color:C.muted}}>Replaces initials and emoji</div>
                          </div>
                        </button>
                    }
                  </div>
                </div>
              )}

              {/* Save / Upgrade buttons — only when editing */}
              {isEditingProfile&&(
                <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
                  <button onClick={()=>{
                    const updated={...editingProfile};
                    savePlayersLS(allPlayers.map(p=>p.id===updated.id?updated:p));
                    setViewingPlayer(updated);
                    setIsEditingProfile(false);
                    setEditingProfile(null);
                  }} style={{...btnStyle(GR.profile),width:"100%",fontSize:16,padding:"15px",borderRadius:50,display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
                    Save Profile
                  </button>
                  {!isPro&&(
                    <button onClick={()=>{setUpgradeFrom("profile");navigate("upgrade");}}
                      style={{width:"100%",padding:"11px",borderRadius:50,border:`1.5px solid ${C.gold}`,background:`${C.gold}14`,color:"#9a6800",fontSize:13,fontWeight:800,fontFamily:"'Nunito',sans-serif",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:7}}>
                      <span style={{fontSize:14}}>⭐</span> Game Night+ — sync across devices
                    </button>
                  )}
                </div>
              )}

              {/* Skin selector */}
              <div style={{background:C.cardBg||"#fff",borderRadius:16,overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,0.05)",marginBottom:12}}>
                <div style={{padding:"10px 16px",borderBottom:`1px solid ${C.cardBorder||"#f0f0f0"}`}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                    <div style={{fontSize:11,fontWeight:800,color:C.muted,textTransform:"uppercase",letterSpacing:0.5}}>Theme</div>
                    {!isPro&&<span style={{background:C.gold,color:C.dark,borderRadius:50,padding:"2px 8px",fontSize:10,fontWeight:800}}>Game Night+</span>}
                  </div>
                </div>
                <div style={{padding:"12px 16px",display:"flex",flexDirection:"column",gap:8}}>
                  {Object.values(SKINS).map(s=>{
                    const active=skinId===s.id;
                    const locked=!s.free&&!isPro;
                    return(
                      <button key={s.id} onClick={()=>locked?navigate("upgrade"):applySkin(s.id)}
                        style={{display:"flex",alignItems:"center",gap:12,padding:"10px 12px",borderRadius:12,
                          border:`2px solid ${active?C.teal:"transparent"}`,
                          background:active?`${C.teal}14`:"#f7f8fa",
                          cursor:"pointer",fontFamily:"'Nunito',sans-serif",textAlign:"left",width:"100%",
                          opacity:locked?0.6:1}}>
                        {/* Mini color bar preview */}
                        <div style={{display:"flex",gap:2,flexShrink:0}}>
                          {s.bar.map((c,i)=>(
                            <div key={i} style={{width:10,height:28,borderRadius:3,background:c}}/>
                          ))}
                        </div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontWeight:800,fontSize:14,color:C.dark}}>{s.emoji} {s.name}</div>
                          <div style={{fontSize:11,color:C.muted,marginTop:1}}>
                            {s.free?"Free":locked?"Game Night+":"Applied"}
                          </div>
                        </div>
                        {active&&<div style={{fontSize:16,color:C.teal}}>✓</div>}
                        {locked&&<div style={{fontSize:13,color:C.muted}}>🔒</div>}
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

        </div>
        <BottomBar>
          <button onClick={()=>{setSetupPlayers([{name:pl.name},{name:""}]);navigate('setup');}} style={{...btnStyle(`linear-gradient(135deg, ${C.teal}, #1a5f82)`),width:"100%",fontSize:16,padding:"16px",borderRadius:50,display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
            <IconTrain size={20} color="#fff"/> Start game with {pl.name} →
          </button>
        </BottomBar>
      </Screen>
    );
  }

  // ── UPGRADE ────────────────────────────────────────────────────────────────
  if(screen==="upgrade"){
    const features=["Full game history & stats","Squads synced to your account","AI pip counting with camera","Recover your profile on any device"];
    return(
      <Screen style={{background:C.bg}}>
        <div style={{background:GR.upgrade,padding:"calc(env(safe-area-inset-top) + 16px) 18px 20px"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
            <button onClick={()=>goBack()} style={{background:"rgba(255,255,255,0.22)",border:"none",color:"#fff",width:38,height:38,borderRadius:"50%",fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
            <span style={{background:"rgba(255,255,255,0.25)",color:"#fff",borderRadius:50,padding:"4px 14px",fontSize:11,fontWeight:900,fontFamily:"'Nunito',sans-serif",letterSpacing:0.5}}>Game Night+</span>
          </div>
          <div style={{fontFamily:"'Fredoka One',cursive",fontSize:28,color:"#fff",lineHeight:1.1}}>Save every game night forever</div>
          <div style={{color:"rgba(255,255,255,0.85)",fontSize:13,marginTop:4,lineHeight:1.5}}>Upgrade once. Keep your history, stats and squads on any device.</div>
        </div>
        <ColorBar colors={skin.bar}/>
        <div style={{padding:"16px 14px",paddingBottom:"calc(24px + env(safe-area-inset-bottom))"}}>
          <div style={{background:"#fff",borderRadius:18,overflow:"hidden",boxShadow:"0 2px 12px rgba(0,0,0,0.06)",marginBottom:16}}>
            {features.map((f,i)=>(
              <div key={f} style={{display:"flex",alignItems:"center",gap:12,padding:"14px 16px",borderBottom:i<features.length-1?"1px solid #f0f0f0":"none"}}>
                <div style={{width:26,height:26,borderRadius:"50%",background:"linear-gradient(135deg, #c07800, #e8a020)",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontWeight:900,fontSize:12,color:"#fff"}}>✓</div>
                <span style={{color:C.dark,fontWeight:700,fontSize:15}}>{f}</span>
              </div>
            ))}
          </div>
          <div style={{textAlign:"center",marginBottom:20}}>
            <div style={{fontFamily:"'Fredoka One',cursive",fontSize:52,color:"#c07800",lineHeight:1}}>$3.99</div>
            <div style={{color:C.muted,fontSize:13,marginTop:2}}>one-time · no subscription</div>
          </div>
          <button onClick={()=>alert("Coming soon — payment integration in progress.")} style={{...btnStyle("linear-gradient(135deg, #c07800, #e8a020)"),width:"100%",fontSize:17,padding:"18px",borderRadius:50,fontWeight:900,letterSpacing:0.5,boxShadow:"0 6px 24px rgba(192,120,0,0.35)"}}>Upgrade to Game Night+</button>
          <button onClick={()=>goBack()} style={{display:"block",width:"100%",background:"none",border:"none",color:C.muted,fontSize:14,fontWeight:600,fontFamily:"'Nunito',sans-serif",cursor:"pointer",padding:"14px 8px",textAlign:"center"}}>No thanks</button>
        </div>
      </Screen>
    );
  }

  // ── RULES ──────────────────────────────────────────────────────────────────
  if(screen==="rules"){
    const dealTables=[
      {
        set:12, total:91, note:"up to 8 players",
        rows:[["2–4","15","varies"],["5","12","26"],["6","11","20"],["7","10","14"],["8","9","10"]],
      },
      {
        set:9, total:55, note:"best for 2–4 players",
        rows:[["2","12","31"],["3","11","22"],["4","10","15"]],
      },
      {
        set:6, total:28, note:"short games, 2–4 players",
        rows:[["2","7","14"],["3","6","10"],["4","5","8"]],
      },
    ];
    const quickSteps=[
      {title:"Objective",text:"Be the player with the lowest score when the game ends. Each round, you score the total pips on tiles left in your hand."},
      {title:"Setup",text:"Shuffle all dominoes face down. Each player draws tiles based on player count. The remaining tiles form the 'boneyard'. Place the starting double (e.g. 12-12) face up in the center hub."},
      {title:"Starting a round",text:"The player with the highest double places it in the center. Each player must start their personal train by playing off that double. If a player cannot start their train, they draw from the boneyard until they can.",dealBtn:true},
      {title:"Taking a Turn",text:"On your turn you must play a tile on your own train, the Mexican Train, or any open (public) train. If you cannot play, draw one tile from the boneyard. If you still can't play, place a marker on your train making it public."},
      {title:"The Mexican Train",text:"Anyone can start or add to the Mexican Train, which also branches off the center hub. It is always public."},
      {title:"Going Out",text:"Play your last tile to go out. All other players count the pips remaining in their hand and record that as their score for the round. Playing a double-blank (0-0) scores 50 points."},
      {title:"Rounds",text:"Each round starts with the next lower double as the hub. A Double-12 game plays from 12-12 down to 0-0 for 13 rounds total. Choose 'Evens' or 'Odds' for a shorter game."},
      {title:"Winning",text:"After the final round (0-0), the player with the lowest total score wins!"},
    ];
    const variants=[
      {tag:"Scoring variant",tagBg:C.sky,title:"Round order",text:"Standard play goes 12 down to 0. Some groups prefer starting at 0 and working up to 12 — this changes which rounds feel easy vs. tense."},
      {tag:"Scoring variant",tagBg:C.sky,title:"Double-blank value",text:"Most rules count the double-blank as 0 points. Some groups score it as 50 — making it a high-stakes tile to be caught holding."},
      {tag:"Setup variant",tagBg:C.sky,title:"Starting tile",text:"Standard: draw from the boneyard until someone finds the engine tile. Some groups let whoever holds the highest double go first instead."},
      {tag:"Round variant",tagBg:C.sky,title:"Game length",text:"A full game is 13 rounds (12 down to 0). Popular shorter variants: 6 rounds or just 3 rounds for a quick game night."},
      {tag:"Doubles rule",tagBg:C.sky,title:"Open doubles (relaxed)",text:"Standard rules require an open double to be covered immediately — the very next player must play on it before anything else. Some groups drop this rule entirely and treat doubles like any other tile, removing the obligation. This speeds up the game but eliminates the tactical pressure of leaving a double exposed."},
      {tag:"House rule",tagBg:C.gold,title:"Forgetting \"uno\"",text:"When down to your last tile, announce it. If another player catches you forgetting before your next turn, common penalties are drawing 1 or 2 tiles. This happens at the table — agree before you start!"},
    ];
    const tabs=[['deal','Deal Chart'],['quick','Quick Rules'],['house','House Rules']];
    return(
      <Screen style={{background:C.bg,display:"flex",flexDirection:"column",height:"100dvh",overflow:"hidden"}}>
        {/* Header */}
        <div style={{background:GR.profile,padding:"calc(env(safe-area-inset-top) + 20px) 20px 20px",position:"relative",overflow:"hidden",flexShrink:0}}>
          <div style={{position:"absolute",bottom:-40,right:-40,width:140,height:140,borderRadius:"50%",background:"rgba(255,255,255,0.12)"}}/>
          <button onClick={()=>goBack()} style={{background:"rgba(255,255,255,0.22)",border:"none",color:"#fff",width:40,height:40,borderRadius:"50%",fontSize:18,cursor:"pointer",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <IconRules size={26} color="#fff"/>
            <div>
              <div style={{fontFamily:"'Fredoka One',cursive",fontSize:28,color:"#fff",lineHeight:1}}>How to Play</div>
              <div style={{color:"rgba(255,255,255,0.85)",fontSize:13,marginTop:2}}>Mexican Train Dominoes</div>
            </div>
          </div>
        </div>
        <ColorBar colors={skin.bar}/>
        {/* Tab Nav — sticky */}
        <div style={{background:"#fff",borderBottom:"1px solid #eee",display:"flex",flexShrink:0,position:"sticky",top:0,zIndex:10}}>
          {tabs.map(([key,label])=>{
            const active=rulesTab===key;
            return(
              <button key={key} onClick={()=>switchRulesTab(key)} style={{flex:1,padding:"13px 4px",border:"none",background:"none",cursor:"pointer",fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:13,color:active?C.teal:C.muted,borderBottom:active?`3px solid ${C.teal}`:"3px solid transparent",transition:"color 0.15s"}}>
                {label}
              </button>
            );
          })}
        </div>
        {/* Scrollable content */}
        <div ref={rulesScrollRef} style={{flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch",padding:"14px 14px 40px"}}>

          {/* ── DEAL CHART TAB ── */}
          {rulesTab==='deal'&&(
            <div>
              <div style={{background:`${C.sky}22`,border:`1px solid ${C.sky}66`,borderRadius:14,padding:"11px 14px",marginBottom:16,fontSize:13,color:C.dark,lineHeight:1.55}}>
                How many tiles does each player draw? Find your domino set below. <strong>Always remove the engine tile first</strong> — it goes in the center hub.
              </div>
              {dealTables.map(({set,total,note,rows})=>{
                const hdr=PIP_COLOR[set];
                return(
                  <div key={set} style={{background:"#fff",borderRadius:16,overflow:"hidden",marginBottom:14,boxShadow:"0 2px 10px rgba(0,0,0,0.06)"}}>
                    <div style={{background:hdr,padding:"10px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                      <div style={{fontFamily:"'Fredoka One',cursive",color:"#fff",fontSize:18}}>Double-{set}</div>
                      <div style={{color:"rgba(255,255,255,0.8)",fontSize:11,fontWeight:700}}>{total} tiles · {note}</div>
                    </div>
                    <table style={{width:"100%",borderCollapse:"collapse"}}>
                      <thead>
                        <tr style={{background:"#f7f8fa"}}>
                          {["Players","Tiles each","Boneyard"].map(h=>(
                            <th key={h} style={{padding:"8px 12px",textAlign:"left",fontSize:11,fontWeight:800,color:C.muted,textTransform:"uppercase",letterSpacing:0.5}}>{h}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {rows.map(([p,t,b],ri)=>(
                          <tr key={ri} style={{borderTop:"1px solid #f0f0f0"}}>
                            <td style={{padding:"10px 12px",fontWeight:800,fontSize:15,color:C.dark,fontFamily:"'Fredoka One',cursive"}}>{p}</td>
                            <td style={{padding:"10px 12px",fontWeight:700,fontSize:15,color:hdr}}>{t}</td>
                            <td style={{padding:"10px 12px",fontSize:14,color:C.muted}}>{b}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                );
              })}
              <div style={{background:`${C.gold}22`,border:`1px solid ${C.gold}88`,borderRadius:14,padding:"11px 14px",fontSize:13,color:C.dark,lineHeight:1.55}}>
                💡 Playing with fewer players than the max? A bigger boneyard means more draws mid-game — rounds tend to last longer.
              </div>
            </div>
          )}

          {/* ── QUICK RULES TAB ── */}
          {rulesTab==='quick'&&(
            <div>
              {quickSteps.map((s,i)=>(
                <div key={i} style={{background:"#fff",borderRadius:16,padding:"14px 16px",marginBottom:10,boxShadow:"0 2px 10px rgba(0,0,0,0.05)",display:"flex",gap:12}}>
                  <div style={{flexShrink:0,width:26,height:26,borderRadius:"50%",background:`linear-gradient(135deg, #1b7a72, #1a5f82)`,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Fredoka One',cursive",fontSize:14,color:"#fff",marginTop:1}}>{i+1}</div>
                  <div style={{flex:1}}>
                    <div style={{fontFamily:"'Fredoka One',cursive",fontSize:16,color:C.teal,marginBottom:4}}>{s.title}</div>
                    <div style={{fontSize:14,color:"#444",lineHeight:1.6}}>{s.text}</div>
                    {s.dealBtn&&(
                      <button onClick={()=>switchRulesTab('deal')} style={{display:"inline-flex",alignItems:"center",gap:5,marginTop:8,padding:"6px 12px",borderRadius:50,background:`${C.teal}22`,border:`0.5px solid ${C.teal}`,color:C.teal,fontSize:11,fontWeight:800,fontFamily:"'Nunito',sans-serif",cursor:"pointer"}}>
                        See Deal Chart →
                      </button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* ── HOUSE RULES TAB ── */}
          {rulesTab==='house'&&(
            <div>
              <div style={{fontSize:11,fontWeight:800,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:10,paddingLeft:2}}>Variants &amp; House Rules</div>
              {variants.map((v,i)=>(
                <div key={i} style={{background:"#fff",borderRadius:16,padding:"14px 16px",marginBottom:10,boxShadow:"0 2px 10px rgba(0,0,0,0.05)"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                    <Badge label={v.tag} bg={v.tagBg}/>
                  </div>
                  <div style={{fontFamily:"'Fredoka One',cursive",fontSize:16,color:C.dark,marginBottom:4}}>{v.title}</div>
                  <div style={{fontSize:14,color:"#444",lineHeight:1.6}}>{v.text}</div>
                </div>
              ))}
            </div>
          )}

        </div>
      </Screen>
    );
  }

  // ── Loading ────────────────────────────────────────────────────────────────
  return(
    <Screen style={{background:`linear-gradient(160deg, ${C.dark} 0%, #2a1a3a 100%)`,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
      <div style={{width:48,height:48,borderRadius:12,background:`linear-gradient(135deg, ${C.coral}, ${C.pink})`,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <IconTrain size={26} color="#fff"/>
      </div>
      <div style={{fontFamily:"'Fredoka One',cursive",fontSize:20,color:"rgba(255,255,255,0.4)"}}>
        {authReady?"Loading...":"Starting up..."}
      </div>
    </Screen>
  );
}

// Mount after Firebase is ready
waitForFb(()=>{
  const root=ReactDOM.createRoot(document.getElementById("root"));
  root.render(React.createElement(App));
});
</script>
</body>
</html>
