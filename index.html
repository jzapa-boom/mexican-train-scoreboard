function genCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let c = "";
  for (let i = 0; i < 4; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return c;
}

// ── Components ─────────────────────────────────────────────────────────────
// Domino renders a single half-tile (square) using the exact SVG spec
function Domino({value,size=80,selected=false,count=0,onClick}){
  const pc=PIP_COLOR[value]??"#222";
  const isBlank=value===0;
  const r=value>=10?5.4:6;
  const data=DOMINO_PIPS[value]??{L:[],R:[]};
  // Render left half only (square tile) cropped to 38,26,67.5,68
  const aspect=67.5/68;
  const w=size;
  const h=Math.round(size/aspect);
  return(
    <div onClick={onClick} style={{position:"relative",display:"inline-block",cursor:onClick?"pointer":"default",WebkitUserSelect:"none",userSelect:"none"}}>
      <div style={{width:w,height:h,background:selected?(isBlank?"#fff8e1":"#fffaf0"):"#fff",border:`3px solid ${selected?(isBlank?C.gold:pc):"#e4e4e4"}`,boxShadow:selected?`0 0 0 3px ${isBlank?C.gold:pc}44, 0 6px 20px ${isBlank?C.gold:pc}28`:"0 2px 8px rgba(0,0,0,0.07)",borderRadius:size*0.1,transition:"transform 0.12s, box-shadow 0.12s",transform:selected?"scale(1.06)":"scale(1)",minWidth:44,minHeight:44,overflow:"hidden"}}>
        <svg width="100%" height="100%" viewBox="38 26 67.5 68" style={{display:"block"}}>
          <path d={LEFT_PATH} fill="none" stroke="#e4e4e4" strokeWidth="0.5"/>
          {isBlank
            ?<line x1="48" y1="60" x2="96" y2="60" stroke="#ccc" strokeWidth="3" strokeLinecap="round"/>
            :data.L.map(([cx,cy],i)=><circle key={i} cx={cx} cy={cy} r={r} fill={pc}/>)
          }
        </svg>
      </div>
      {count>0&&<div style={{position:"absolute",top:-9,right:-9,width:24,height:24,borderRadius:"50%",background:C.coral,color:"#fff",fontSize:13,fontWeight:900,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 2px 6px rgba(0,0,0,0.25)",border:"2px solid #fff"}}>{count}</div>}
    </div>
  );
}

// DoubleDomino renders the full tile (both halves) for the scorecard header
function DoubleDomino({value,height=44}){
  const pc=PIP_COLOR[Math.min(value,12)]??"#222";
  const r=value>=10?5.4:6;
  const data=DOMINO_PIPS[Math.min(value,12)]??{L:[],R:[]};
  const w=Math.round(height*(135/68));
  return(
    <svg width={w} height={height} viewBox="38 26 135 68" style={{display:"block"}}>
      <path d={TILE_PATH} fill="#fff" stroke="#ddd" strokeWidth="0.6"/>
      <line x1="105.5" y1="26" x2="105.5" y2="94" stroke="#ddd" strokeWidth="0.8"/>
      {data.L.map(([cx,cy],i)=><circle key={"l"+i} cx={cx} cy={cy} r={r} fill={pc}/>)}
      {data.R.map(([cx,cy],i)=><circle key={"r"+i} cx={cx} cy={cy} r={r} fill={pc}/>)}
    </svg>
  );
}

// ── localStorage helper ────────────────────────────────────────────────────
function useLS(key,initial){
  const [val,setVal]=useState(function(){
    try{ var s=localStorage.getItem(key); return s?JSON.parse(s):initial; }catch(e){ return initial; }
  });
  function save(v){ setVal(v); try{ localStorage.setItem(key,JSON.stringify(v)); }catch(e){} }
  return [val,save];
}

          const profile=snap.val();
          setUserProfile(profile);
          setMyName(profile.name);
          if(profile.isPro) setIsPro(true);
        } else {
          setScreen('welcome');
        }
        setAuthReady(true);
      } else {
        fb.signInAnonymously(fb.auth).catch(()=>{});
      }
    });
    return()=>unsub();
  },[]);

  // Derived
  const startPip     = gameData?.startPip??12;
  const currentRound = gameData?.currentRound??startPip;
  const players      = gameData?.players??[];
  const scores       = gameData?.scores??{};
  const getTotal     = n=>Object.values(scores[n]??{}).reduce((a,b)=>a+(b||0),0);
  const getWins      = n=>Object.values(scores[n]??{}).filter(s=>s===0).length;
  const getRound     = (n,pip)=>scores[n]?.[String(startPip-pip)]??null;
  const totals       = Object.fromEntries(players.map(n=>[n,getTotal(n)]));
  const ranked       = [...players].sort((a,b)=>totals[a]-totals[b]);
  const roundIdx     = startPip-currentRound;
  const isHost       = gameData?.hostName===myName;

  async function createGame(){
    const names=setupPlayers.map(p=>p.name.trim()).filter(Boolean);
    if(names.length<2) return;
    const code=genCode();
    const initScores={};
    names.forEach(n=>initScores[n]={});
    // Build round list respecting roundOrder and gameLength
    let allRounds=Array.from({length:setupPip+1},(_,i)=>setupPip-i); // [12..0] desc
    if(houseRules.roundOrder==='asc') allRounds=[...allRounds].reverse(); // [0..12]
    if(houseRules.gameLength==='6') allRounds=allRounds.slice(0,6);
    else if(houseRules.gameLength==='3') allRounds=allRounds.slice(0,3);
    const playerUids={};
    if(currentUser) playerUids[names[0]]=currentUser.uid;
    await fb.set(fb.ref(fb.db,`games/${code}`),{
      startPip:setupPip,
      currentRound:allRounds[0],
      roundsList:allRounds,
      status:"active",players:names,
      scores:initScores,
      houseRules:houseRules,
      playerUids:playerUids,
      hostName:names[0],
      createdAt:Date.now(),
    });
    setGameCode(code);
    setScreen("pickname");
  }

  async function lookupGame(){
    const code=joinInput.toUpperCase().trim();
    if(code.length!==4){setJoinError("Enter the 4-letter game code");return;}
    const snap=await fb.get(fb.ref(fb.db,`games/${code}`));
    if(!snap.exists()){setJoinError("Game not found — check the code");return;}
    const data=snap.val();
    if(data.status==="done"){setJoinError("That game has already ended");return;}
    setGameData(data);
    setGameCode(code);
    setJoinError("");
    setScreen("pickname");

  async function submitScore(score){
    const targetRound = editingRound !== null ? editingRound : currentRound;
    const targetPlayer = scoringFor || myName;
    const ridx=String(startPip-targetRound);
    const updates={};
    updates[`games/${gameCode}/scores/${targetPlayer}/${ridx}`]=score;
    if(editingRound===null){
      const allDone=players.every(p=>p===targetPlayer?true:scores[p]?.[ridx]!=null);
      if(allDone){
        const roundsList=gameData?.roundsList??[];
        const currentIdx=roundsList.indexOf(currentRound);
        const nextRound=roundsList[currentIdx+1];
        if(nextRound!=null) updates[`games/${gameCode}/currentRound`]=nextRound;
        else updates[`games/${gameCode}/status`]="done";
      }
    }
    await fb.update(fb.ref(fb.db),updates);
    setSelected({});setCameraScore(null);setEditingRound(null);setScoringFor("");
    setScreen("scorecard");
  }

  async function writeGameResults(data){
    const finalPlayers=data.players??[];
    const finalScores=data.scores??{};
    const finalUids=data.playerUids??{};
    const finalTotals=Object.fromEntries(finalPlayers.map(n=>[n,Object.values(finalScores[n]??{}).reduce((a,b)=>a+(b||0),0)]));
    const placement=finalPlayers.slice().sort((a,b)=>finalTotals[a]-finalTotals[b]);
    const winner=placement[0];
    const updates={};
    finalPlayers.forEach(function(name){
      const uid=finalUids[name];
      if(!uid) return;
      const myScore=finalTotals[name]??0;
      const myPlacement=placement.indexOf(name)+1;
      updates[`profiles/${uid}/gamesPlayed`]=fb.increment(1);
      if(name===winner) updates[`profiles/${uid}/wins`]=fb.increment(1);
      updates[`profiles/${uid}/totalScore`]=fb.increment(myScore);
    });
    if(Object.keys(updates).length>0) await fb.update(fb.ref(fb.db),updates);
    // Append game history entries separately (can't use increment on arrays)
    finalPlayers.forEach(function(name){
      const uid=finalUids[name];
      if(!uid) return;
      const myScore=finalTotals[name]??0;
      const myPlacement=placement.indexOf(name)+1;
      const historyEntry={gameCode:data.gameCode||gameCode,date:Date.now(),players:finalPlayers,myScore,placement:myPlacement};
      fb.get(fb.ref(fb.db,`profiles/${uid}/gameHistory`)).then(function(snap){
        const existing=snap.exists()?snap.val():[];
        const arr=Array.isArray(existing)?existing:Object.values(existing);
        arr.push(historyEntry);
        fb.update(fb.ref(fb.db),{[`profiles/${uid}/gameHistory`]:arr.slice(-20)});
      });
    });
  }

    const blankVal=gameData?.houseRules?.blankValue??50;
    return Object.entries(selected).reduce((s,[v,c])=>{

      return s+pipVal*c;

  async function handlePhoto(e){
    const file=e.target.files?.[0];

    setCameraLoading(true);setCameraError(null);setCameraScore(null);
    try{
      const base64=await new Promise((res,rej)=>{
        const r=new FileReader();
        r.onload=()=>res(r.result.split(",")[1]);
        r.onerror=rej;
        r.readAsDataURL(file);
      });
      const resp=await fetch("/.netlify/functions/analyze-pips",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({imageData:base64,mimeType:file.type}),
      });
      const data=await resp.json();
      if(!resp.ok) throw new Error(data.error||"bad");
      const n=parseInt(data.count??"");
      if(isNaN(n)) throw new Error("bad");
      setCameraScore(n);
    }catch{
      setCameraError("Couldn't count pips — try a clearer photo");
    }finally{
      setCameraLoading(false);
      e.target.value="";
    }
  }

          {/* Load a Squad */}
          {squads.length>0&&(
            <div style={{marginBottom:16}}>
              <div style={{fontWeight:800,fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:0,marginBottom:2}}>Load a squad</div>
              <div style={{fontSize:12,color:C.muted,marginBottom:10}}>Pre-fill players from a saved group</div>

                    {sq.name}
                  </button>
                ))}
                <button onClick={()=>{setSquadsFrom('setup');setScreen('squads');}}
                  style={{padding:"7px 14px",borderRadius:50,border:`1.5px dashed ${C.teal}`,background:"transparent",color:C.teal,fontSize:13,fontWeight:800,fontFamily:"'Nunito',sans-serif",cursor:"pointer"}}>
                  + Squads
                </button>
              </div>
            </div>
          )}

          {/* Players */}
          <div style={{fontWeight:800,fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:0,marginBottom:10}}>Players</div>

            <div key={i} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
              <Avatar name={p.name||"?"} idx={i} size={40}/>
              <input
                value={p.name}
                onChange={e=>setSetupPlayers(prev=>prev.map((pl,j)=>j===i?{...pl,name:e.target.value}:pl))}
                placeholder={`Player ${i+1}`}
                style={{flex:1,padding:"13px 16px",borderRadius:12,border:"2px solid #eee",fontSize:16,fontFamily:"'Nunito',sans-serif",outline:"none",minHeight:48,background:"#fff"}}
              />
              {setupPlayers.length>2&&(
                <button onClick={()=>setSetupPlayers(prev=>prev.filter((_,j)=>j!==i))} style={{background:"none",border:"none",color:"#ccc",fontSize:22,cursor:"pointer",width:40,height:40,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
              )}
            </div>
          ))}
          {setupPlayers.length<8&&(
            <button onClick={()=>setSetupPlayers(prev=>[...prev,{name:""}])} style={{width:"100%",padding:"13px",borderRadius:12,minHeight:48,border:`2px dashed ${C.sky}99`,background:`${C.sky}0a`,color:C.sky,fontSize:14,fontWeight:800,cursor:"pointer",marginTop:4}}>+ Add Player</button>
          )}
          <button onClick={createGame} disabled={playerNames.length<2} style={{...btnStyle(playerNames.length<2?"#ddd":`linear-gradient(135deg, ${C.coral}, ${C.pink})`),width:"100%",marginTop:20,fontSize:18,padding:"17px",borderRadius:50,letterSpacing:1,boxShadow:playerNames.length<2?"none":`0 6px 24px ${C.pink}44`,cursor:playerNames.length<2?"not-allowed":"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
            <IconTrain size={22} color="#fff"/> Create Game
          </button>
        </div>
      </Screen>
    );
  }

  // ── PICK NAME ──────────────────────────────────────────────────────────────
  if(screen==="pickname"){
    const playerList=gameData?.players??[];
    const profileName=userProfile?.name??"";
    const isPro=userProfile?.isPro===true;

    async function claimSlot(hostName){
      const updates={};
      const finalName=isPro&&profileName&&profileName!==hostName?profileName:hostName;
      // If Pro and name differs, rename slot in game
      if(isPro&&profileName&&profileName!==hostName){
        const updatedPlayers=playerList.map(n=>n===hostName?profileName:n);
        const updatedScores={};
        Object.entries(gameData.scores??{}).forEach(([k,v])=>{
          updatedScores[k===hostName?profileName:k]=v;
        });
        updates[`games/${gameCode}/players`]=updatedPlayers;
        updates[`games/${gameCode}/scores`]=updatedScores;
      }
      if(currentUser) updates[`games/${gameCode}/playerUids/${finalName}`]=currentUser.uid;
      await fb.update(fb.ref(fb.db),updates);
      setMyName(finalName);
      setScreen("scorecard");
    }

    async function addMyselfToGame(){
      if(!isPro||!profileName) return;
      const updatedPlayers=[...playerList,profileName];
      const updatedScores={...(gameData.scores??{}),[profileName]:{}};
      const updates={
        [`games/${gameCode}/players`]:updatedPlayers,
        [`games/${gameCode}/scores`]:updatedScores,
        [`games/${gameCode}/playerUids/${profileName}`]:currentUser.uid,
      };
      await fb.update(fb.ref(fb.db),updates);
      setMyName(profileName);
      setScreen("scorecard");
    }

    return(
      <Screen style={{background:C.bg}}>
        <div style={{background:`linear-gradient(135deg, ${C.coral}, ${C.pink})`,padding:"calc(env(safe-area-inset-top) + 24px) 20px 32px",position:"relative"}}>
          <div style={{position:"absolute",bottom:-40,right:-40,width:140,height:140,borderRadius:"50%",background:"rgba(255,255,255,0.12)",pointerEvents:"none"}}/>
          <div style={{fontFamily:"'Fredoka One',cursive",fontSize:30,color:"#fff"}}>Who are you?</div>
          <div style={{color:"rgba(255,255,255,0.8)",fontSize:14,marginTop:4}}>Tap your name to join</div>
          <button onClick={copyCode} style={{display:"inline-flex",alignItems:"center",gap:8,marginTop:14,background:"rgba(255,255,255,0.2)",border:"none",borderRadius:50,padding:"6px 14px",cursor:"pointer"}}>
            <span style={{color:"rgba(255,255,255,0.7)",fontSize:11,fontWeight:700,letterSpacing:1}}>GAME CODE</span>
            <span style={{fontFamily:"'Fredoka One',cursive",color:"#fff",fontSize:22,letterSpacing:4}}>{gameCode}</span>
            <IconCopy size={16} color={copied?"#fff":"rgba(255,255,255,0.6)"}/>
          </button>
          {copied&&<div style={{color:"rgba(255,255,255,0.7)",fontSize:12,marginTop:6}}>Copied!</div>}
        </div>
        <div style={{margin:"12px 14px 0",background:"#fff",borderRadius:22,padding:"20px 16px",boxShadow:"0 4px 24px rgba(0,0,0,0.07)"}}>
          {playerList.map((name,i)=>(
            <button key={name} onClick={()=>claimSlot(name)} style={{width:"100%",display:"flex",alignItems:"center",gap:14,padding:"14px 16px",marginBottom:10,borderRadius:16,border:`2px solid ${C.sky}33`,background:`${C.sky}08`,cursor:"pointer",fontFamily:"'Nunito',sans-serif",textAlign:"left"}}>
              <Avatar name={name} idx={i} size={44}/>
              <div style={{flex:1}}>
                <div style={{fontWeight:800,fontSize:18,color:C.dark}}>{name}</div>
                {isPro&&profileName&&profileName!==name&&(
                  <div style={{fontSize:11,color:C.teal,fontWeight:700,marginTop:2}}>Will join as {profileName}</div>
                )}
              </div>
              <div style={{color:C.sky,fontSize:13,fontWeight:700,flexShrink:0}}>That's me →</div>
            </button>
          ))}
          {isPro&&profileName&&!playerList.includes(profileName)&&(
            <button onClick={addMyselfToGame} style={{width:"100%",display:"flex",alignItems:"center",gap:14,padding:"14px 16px",marginBottom:10,borderRadius:16,border:`2px solid ${C.gold}55`,background:`${C.gold}0a`,cursor:"pointer",fontFamily:"'Nunito',sans-serif",textAlign:"left"}}>
              <Avatar name={profileName} idx={7} size={44}/>
              <div style={{flex:1}}>
                <div style={{fontWeight:800,fontSize:18,color:C.dark}}>{profileName}</div>
                <div style={{fontSize:11,color:C.gold,fontWeight:700,marginTop:2}}>Game Night+ — add yourself</div>
              </div>
              <div style={{color:C.gold,fontSize:13,fontWeight:700,flexShrink:0}}>Join →</div>
            </button>
          )}
          <div style={{marginTop:8,padding:"12px 16px",background:"#f7f8fa",borderRadius:12,fontSize:12,color:C.muted,textAlign:"center",lineHeight:1.5}}>
            Share code <strong style={{color:C.dark}}>{gameCode}</strong> so others can join from their phone
          </div>
        </div>
      </Screen>
    );
  }

  // ── SCORECARD ──────────────────────────────────────────────────────────────
  if(screen==="scorecard"&&gameData){
    const rank=ranked;
    return(
      <Screen style={{background:C.bg}}>
        {/* Compact header — round number, double domino, game code in one row */}
        <div style={{background:`linear-gradient(135deg, ${C.coral}, ${C.pink})`,padding:"calc(env(safe-area-inset-top) + 14px) 18px 12px",flexShrink:0}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
            <div style={{display:"flex",alignItems:"baseline",gap:5,flexShrink:0}}>
              <div style={{fontFamily:"'Fredoka One',cursive",fontSize:52,color:"#fff",lineHeight:1}}>{currentRound}</div>
              <div>
                <div style={{fontSize:9,fontWeight:800,color:"rgba(255,255,255,0.6)",letterSpacing:2,textTransform:"uppercase",lineHeight:1.2}}>ROUND</div>
                <div style={{color:"rgba(255,255,255,0.5)",fontSize:11,lineHeight:1.2}}>of {startPip}</div>
              </div>
            </div>
            <div style={{flex:1,display:"flex",justifyContent:"center"}}>
              <div style={{background:"rgba(255,255,255,0.95)",borderRadius:10,padding:"5px 8px"}}>
                <DoubleDomino value={Math.min(currentRound,12)} height={34}/>
              </div>
            </div>
            <button onClick={copyCode} style={{background:"rgba(255,255,255,0.18)",border:"none",borderRadius:50,padding:"6px 14px",cursor:"pointer",textAlign:"center",flexShrink:0}}>
              <div style={{fontSize:8,fontWeight:700,color:"rgba(255,255,255,0.65)",letterSpacing:1,textTransform:"uppercase"}}>Code</div>
              <div style={{fontFamily:"'Fredoka One',cursive",color:"#fff",fontSize:18,letterSpacing:3,lineHeight:1.1}}>{gameCode}</div>
            </button>
          </div>
          {copied&&<div style={{textAlign:"center",color:"rgba(255,255,255,0.7)",fontSize:11,marginTop:4}}>Copied!</div>}
        </div>
        {/* Color bar divider */}
        <div style={{display:"flex",height:7,flexShrink:0}}>
          {[C.sky,C.pink,C.coral,C.gold,C.lime,C.teal].map((c,i)=><div key={i} style={{flex:1,background:c}}/>)}
        </div>
        <div style={{padding:"10px 12px",paddingBottom:"calc(100px + env(safe-area-inset-bottom))",flex:1,overflowY:"auto"}}>
          {rank.map((name,i)=>{
            const total=totals[name],wins=getWins(name);
            const hasScore=scores[name]?.[String(roundIdx)]!=null;
            const gap=total-totals[rank[0]];
            const isMe=name===myName;
            const allowHost=gameData?.playerPrefs?.[name]?.allowHostScore===true;
            const canScore=isMe||(isHost&&(name===gameData?.hostName||allowHost));
            return(
              <div key={name} style={{background:"#fff",borderRadius:20,padding:"12px 14px",marginBottom:8,display:"flex",alignItems:"center",gap:10,boxShadow:isMe?`0 4px 20px ${C.sky}33`:i===0?`0 4px 20px ${C.coral}22`:"0 2px 10px rgba(0,0,0,0.05)",border:isMe?`2px solid ${C.sky}55`:i===0?`2px solid ${C.coral}33`:"2px solid transparent"}}>
                <div style={{fontFamily:"'Fredoka One',cursive",fontSize:20,color:i===0?C.coral:"#bbb",width:22,flexShrink:0}}>{i+1}</div>
                <Avatar name={name} idx={players.indexOf(name)} size={42}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:800,fontSize:15,color:C.dark,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                    {name} {isMe&&<span style={{fontSize:11,color:C.sky,fontWeight:700}}>(you)</span>}
                    {isHost&&!isMe&&<span style={{fontSize:10,color:C.coral,fontWeight:700}}> ★</span>}
                  </div>
                  <div style={{fontSize:11,marginTop:2,display:"flex",gap:4,flexWrap:"wrap",alignItems:"center"}}>
                    <Badge label={wins===1?"1 win":`${wins} wins`} bg={C.lime}/>
                    {i===0
                      ?<Badge label="Leading" bg={C.gold}/>
                      :gap>0?<Badge label={`${gap} behind`} bg="#f0f0f0"/>:null
                    }
                    {isMe&&!isHost&&(
                      <button onPointerDown={()=>{
                        const updates={};
                        updates[`games/${gameCode}/playerPrefs/${myName}/allowHostScore`]=!allowHost;
                        fb.update(fb.ref(fb.db),updates);
                      }} style={{display:"flex",alignItems:"center",gap:4,background:"none",border:`1px solid ${allowHost?C.teal:"#ddd"}`,borderRadius:50,padding:"2px 7px",cursor:"pointer",fontFamily:"'Nunito',sans-serif"}}>
                        <div style={{width:8,height:8,borderRadius:"50%",background:allowHost?C.teal:"#ddd",flexShrink:0}}/>
                        <span style={{fontSize:10,fontWeight:700,color:allowHost?C.teal:C.muted,whiteSpace:"nowrap"}}>Host scoring</span>
                      </button>
                    )}
                  </div>
                </div>
                {/* Fixed-width score column so it never shifts */}
                <div style={{width:40,textAlign:"right",flexShrink:0,fontFamily:"'Fredoka One',cursive",fontSize:28,color:C.dark}}>{total}</div>
                {/* Fixed-width action column */}
                <div style={{width:64,flexShrink:0,display:"flex",justifyContent:"flex-end"}}>
                  {hasScore
                    ? canScore
                      ? <button onClick={()=>{setSelected({});setCameraMode(false);setCameraScore(null);setEditingRound(currentRound);setScoringFor(name);setScreen("counter");}} style={{background:`${C.teal}18`,border:`1.5px solid ${C.teal}55`,borderRadius:10,padding:"6px 10px",cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>
                          <span style={{fontSize:14,color:C.teal}}>✓</span>
                          <span style={{fontSize:11,color:C.teal,fontWeight:800,fontFamily:"'Nunito',sans-serif"}}>Edit</span>
                        </button>
                      : <div style={{fontSize:20,color:C.teal}}>✓</div>
                    : canScore
                      ? <button onClick={()=>{setSelected({});setCameraMode(false);setCameraScore(null);setEditingRound(null);setScoringFor(name);setScreen("counter");}} style={{...btnStyle(`linear-gradient(135deg, ${C.sky}, ${C.teal})`),padding:"8px 12px",fontSize:12,borderRadius:10}}>SCORE</button>
                      : isHost&&!allowHost
                        ? <div style={{fontSize:10,color:"#ccc",fontWeight:600,textAlign:"center",lineHeight:1.3}}>🔒<br/>locked</div>
                        : <div style={{fontSize:11,color:"#ccc",fontWeight:600}}>waiting…</div>
                  }
                </div>
              </div>
            );
          })}
          {/* Legend */}
          <div style={{textAlign:"center",padding:"8px 4px 4px",fontSize:12,color:C.muted,fontWeight:600}}>
            lower score wins · rounds scored out of {startPip}
          </div>
        </div>
        {/* Sticky bottom bar */}
        <div style={{position:"sticky",bottom:0,paddingBottom:"calc(12px + env(safe-area-inset-bottom))",paddingTop:12,paddingLeft:"max(14px, env(safe-area-inset-left))",paddingRight:"max(14px, env(safe-area-inset-right))",background:"rgba(242,244,248,0.97)",backdropFilter:"blur(12px)",WebkitBackdropFilter:"blur(12px)",borderTop:"1px solid rgba(0,0,0,0.05)",boxSizing:"border-box",width:"100%",flexShrink:0}}>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setScreen("fullboard")} style={{flex:1,padding:"13px",borderRadius:14,border:"2px solid #e8e8e8",background:"#fff",color:C.dark,fontWeight:800,fontSize:14,cursor:"pointer",minHeight:48,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              <IconGrid size={18} color={C.dark}/> Scoreboard
            </button>
            <button onClick={()=>{setRulesFrom('scorecard');setRulesTab('deal');setScreen("rules");}} style={{padding:"13px 16px",borderRadius:14,border:"2px solid #e8e8e8",background:"#fff",color:C.teal,fontWeight:800,fontSize:13,cursor:"pointer",minHeight:48,display:"flex",alignItems:"center",justifyContent:"center",gap:6,whiteSpace:"nowrap"}}>
              <IconRules size={16} color={C.teal}/> Rules
            </button>
            <button onClick={()=>setScreen("splash")} style={{padding:"13px 16px",borderRadius:14,border:"2px solid #e8e8e8",background:"#fff",color:C.coral,fontWeight:800,fontSize:13,cursor:"pointer",minHeight:48,display:"flex",alignItems:"center",justifyContent:"center",gap:6,whiteSpace:"nowrap"}}>
              <IconRefresh size={16} color={C.coral}/> Leave
            </button>
          </div>
        </div>
      </Screen>
    );
  }

  // ── COUNTER ────────────────────────────────────────────────────────────────
  if(screen==="counter"&&gameData){
    const targetPlayer = scoringFor || myName;
    const targetRound = editingRound !== null ? editingRound : currentRound;
    const existingScore = editingRound !== null ? getRound(targetPlayer, editingRound) : null;
    const score=cameraScore!==null?cameraScore:calcScore();
    const tiles=Array.from({length:startPip+1},(_,i)=>i);
    const pIdx=players.indexOf(targetPlayer);
    const scoringForOther=targetPlayer!==myName;
    return(
      <Screen style={{background:C.bg}}>
        <div style={{background:`linear-gradient(135deg, ${AVATAR_BG[pIdx%AVATAR_BG.length]}cc, ${C.coral})`,padding:"calc(env(safe-area-inset-top) + 18px) 18px 18px",display:"flex",alignItems:"center",gap:13}}>
          <button onClick={()=>{setEditingRound(null);setScoringFor("");setScreen("scorecard");}} style={{background:"rgba(255,255,255,0.22)",border:"none",color:"#fff",width:40,height:40,borderRadius:"50%",fontSize:18,cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
          <Avatar name={targetPlayer} idx={pIdx} size={48}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{color:"rgba(255,255,255,0.75)",fontSize:11,fontWeight:700,display:"flex",alignItems:"center",gap:6}}>
              Round {targetRound} · scoring for
              {editingRound!==null&&<span style={{background:"rgba(255,255,255,0.25)",borderRadius:50,padding:"2px 8px",fontSize:10,fontWeight:800,letterSpacing:0.5}}>EDITING</span>}
              {scoringForOther&&<span style={{background:`${C.coral}55`,borderRadius:50,padding:"2px 8px",fontSize:10,fontWeight:800,letterSpacing:0.5}}>HOST</span>}
            </div>
            <div style={{color:"#fff",fontWeight:900,fontSize:20,fontFamily:"'Fredoka One',cursive",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{targetPlayer}</div>
          </div>
          <div style={{textAlign:"right",flexShrink:0}}>
            {editingRound!==null&&existingScore!==null&&<div style={{color:"rgba(255,255,255,0.55)",fontSize:10,fontWeight:700,textDecoration:"line-through"}}>{existingScore}</div>}
            <div style={{color:"rgba(255,255,255,0.65)",fontSize:10,fontWeight:700}}>PIPS</div>
            <div style={{fontFamily:"'Fredoka One',cursive",color:"#fff",fontSize:"clamp(38px,11vw,52px)",lineHeight:1}}>{score}</div>
          </div>
        </div>
        <div style={{display:"flex",margin:"12px 12px 0",background:"#fff",borderRadius:14,padding:4,boxShadow:"0 2px 10px rgba(0,0,0,0.06)"}}>
          {[["Tap Tiles",false],["Camera AI",true]].map(([label,cam])=>(
            <button key={label} onClick={()=>{setCameraMode(cam);if(!cam)setCameraScore(null);}} style={{flex:1,padding:"11px 0",borderRadius:11,border:"none",cursor:"pointer",minHeight:46,background:cameraMode===cam?`linear-gradient(135deg, ${C.coral}, ${C.pink})`:"transparent",color:cameraMode===cam?"#fff":C.muted,fontWeight:800,fontSize:"clamp(13px,3.5vw,15px)",fontFamily:"'Nunito',sans-serif",display:"flex",alignItems:"center",justifyContent:"center",gap:7}}>
              {cam?<IconCamera size={18} color={cameraMode===cam?"#fff":C.muted}/>:<IconFinger size={18} color={cameraMode===cam?"#fff":C.muted}/>}
              {label}
            </button>
          ))}
        </div>
        {cameraMode&&(
          <div style={{margin:"12px 12px 0",background:"#fff",borderRadius:20,padding:20,textAlign:"center",boxShadow:"0 2px 12px rgba(0,0,0,0.06)"}}>
            {!isPro?(
              <>
                <div style={{width:64,height:64,borderRadius:16,background:`${C.gold}18`,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px"}}><IconCamera size={36} color={C.gold}/></div>
                <span style={{background:`linear-gradient(135deg, ${C.gold}, ${C.coral})`,color:C.dark,borderRadius:50,padding:"3px 12px",fontSize:11,fontWeight:900,fontFamily:"'Nunito',sans-serif"}}>★ Game Night+ feature</span>
                <div style={{fontFamily:"'Fredoka One',cursive",fontSize:20,color:C.dark,marginTop:10,marginBottom:6}}>AI Pip Counting</div>
                <div style={{fontSize:13,color:C.muted,marginBottom:18,lineHeight:1.55}}>Point your camera at your remaining tiles and let AI count the pips instantly. Available with Game Night+.</div>
                <button onClick={()=>{setUpgradeFrom('counter');setScreen('upgrade');}} style={{...btnStyle(`linear-gradient(135deg, ${C.gold}, ${C.coral})`),width:"100%",fontSize:15,padding:"14px",borderRadius:50,color:C.dark,fontWeight:900,marginBottom:10}}>★ Upgrade to Game Night+ · $3.99</button>
                <button onClick={()=>setCameraMode(false)} style={{background:"none",border:`1.5px solid ${C.muted}44`,color:C.muted,borderRadius:50,padding:"11px",width:"100%",fontSize:14,fontWeight:700,fontFamily:"'Nunito',sans-serif",cursor:"pointer"}}>Use manual counting instead</button>
              </>
            ):(
              <>
                <div style={{display:"flex",justifyContent:"center",marginBottom:8}}><IconCamera size={48} color={C.teal}/></div>
                <div style={{fontWeight:800,color:C.dark,marginBottom:6,fontSize:16}}>Photo your remaining tiles</div>
                <div style={{fontSize:13,color:C.muted,marginBottom:16}}>AI will count all the pips automatically</div>
                <input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={handlePhoto} style={{display:"none"}}/>
                <button onClick={()=>fileRef.current.click()} style={{...btnStyle(`linear-gradient(135deg, ${C.sky}, ${C.teal})`),width:"100%",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                  <IconCamera size={20} color="#fff"/> Take Photo
                </button>
                {cameraLoading&&<div style={{marginTop:16,color:C.teal,fontWeight:700,fontSize:15}}>Counting pips…</div>}
                {cameraError&&<div style={{marginTop:12,color:C.coral,fontSize:13,fontWeight:700}}>{cameraError}</div>}
                {cameraScore!==null&&(
                  <div style={{marginTop:14,padding:"14px 16px",background:`${C.lime}33`,borderRadius:14}}>
                    <div style={{fontSize:11,color:C.muted,fontWeight:800,textTransform:"uppercase",letterSpacing:1}}>AI Counted</div>
                    <div style={{fontFamily:"'Fredoka One',cursive",fontSize:56,color:C.teal,lineHeight:1}}>{cameraScore}</div>
                    <div style={{fontSize:12,color:C.muted}}>pips total</div>
                  </div>
                )}
              </>
            )}
          </div>
        )}
        {!cameraMode&&(
          <div style={{margin:"12px 12px 0",background:"#fff",borderRadius:20,padding:14,boxShadow:"0 2px 12px rgba(0,0,0,0.06)"}}>
            <div style={{fontSize:11,fontWeight:800,color:C.muted,textAlign:"center",textTransform:"uppercase",letterSpacing:1.5,marginBottom:12}}>Tap to add · tap again to increase count · tap at 13 to reset</div>

                {Object.entries(selected).filter(([,c])=>c>0).map(([v,c])=>`${c}×[${Number(v)===0?"50pts":v}]`).join(" + ")} = <strong style={{color:C.dark}}>{score}</strong>

          <div style={{background:"#fff",borderRadius:18,padding:"12px 14px",boxShadow:"0 2px 12px rgba(0,0,0,0.07)",boxSizing:"border-box",width:"100%"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
              <div style={{fontSize:11,color:C.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:1}}>Round Score</div>
              <div style={{fontFamily:"'Fredoka One',cursive",fontSize:36,color:C.dark,lineHeight:1}}>{score}</div>
            </div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>setSelected({})} style={{flex:1,padding:"14px 0",borderRadius:50,border:"none",background:"#f0f0f0",color:C.muted,fontSize:14,fontWeight:800,fontFamily:"'Nunito',sans-serif",cursor:"pointer"}}>CLEAR</button>
              <button onClick={()=>submitScore(score)} style={{flex:2,padding:"14px 0",borderRadius:50,border:"none",background:`linear-gradient(135deg, ${C.coral}, ${C.pink})`,color:"#fff",fontSize:16,fontWeight:800,fontFamily:"'Nunito',sans-serif",cursor:"pointer",boxShadow:`0 6px 22px ${C.pink}44`,letterSpacing:1}}>{editingRound!==null?"UPDATE":"SUBMIT"}</button>
            </div>
          </div>
        </BottomBar>
      </Screen>
    );
  }

  // ── GAME OVER ──────────────────────────────────────────────────────────────
  if(screen==="gameover"&&gameData){
    const rank=ranked;
    return(
      <Screen style={{background:`linear-gradient(160deg, ${C.dark} 0%, #2a1a3a 100%)`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"40px 24px",textAlign:"center"}}>
        <div style={{fontSize:64,marginBottom:8}}>🎉</div>
        <div style={{fontFamily:"'Fredoka One',cursive",fontSize:38,color:C.gold,lineHeight:1,marginBottom:4}}>Game Over!</div>
        <div style={{color:"rgba(255,255,255,0.6)",fontSize:16,marginBottom:32}}>Final Results</div>
        {rank.map((name,i)=>(
          <div key={name} style={{width:"100%",maxWidth:360,display:"flex",alignItems:"center",gap:14,padding:"14px 18px",marginBottom:10,borderRadius:20,background:i===0?"rgba(255,215,0,0.15)":"rgba(255,255,255,0.07)",border:i===0?`2px solid ${C.gold}44`:"1px solid rgba(255,255,255,0.09)"}}>
            <div style={{fontFamily:"'Fredoka One',cursive",fontSize:28,color:i===0?C.gold:"rgba(255,255,255,0.3)",width:32}}>{i===0?"🏆":i+1}</div>
            <Avatar name={name} idx={players.indexOf(name)} size={44}/>
            <div style={{flex:1,textAlign:"left"}}>
              <div style={{color:"#fff",fontWeight:800,fontSize:17}}>{name}{name===myName&&<span style={{color:C.sky,fontSize:12}}> (you)</span>}</div>
              <div style={{color:"rgba(255,255,255,0.5)",fontSize:12}}>{getWins(name)} rounds won</div>
            </div>
            <div style={{fontFamily:"'Fredoka One',cursive",fontSize:32,color:i===0?C.gold:"#fff"}}>{totals[name]}</div>
          </div>
        ))}
        <div style={{display:"flex",flexDirection:"column",gap:12,width:"100%",maxWidth:360,marginTop:24}}>
          {!isPro&&(
            <div style={{background:"rgba(255,255,255,0.06)",border:`1px solid ${C.gold}44`,borderRadius:20,padding:"20px 18px",textAlign:"center",marginBottom:4}}>
              <span style={{background:`linear-gradient(135deg, ${C.gold}, ${C.coral})`,color:C.dark,borderRadius:50,padding:"3px 12px",fontSize:11,fontWeight:900,fontFamily:"'Nunito',sans-serif",letterSpacing:0.5}}>Game Night+</span>

                {["Full game history & stats","AI pip counting with camera"].map(f=>(
                  <div key={f} style={{display:"flex",alignItems:"center",gap:8}}>
                    <div style={{width:20,height:20,borderRadius:"50%",background:`linear-gradient(135deg, ${C.gold}, ${C.coral})`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:11}}>✓</div>
                    <span style={{fontSize:13,color:"rgba(255,255,255,0.8)",fontWeight:600,textAlign:"left"}}>{f}</span>
                  </div>
                ))}
              </div>
              <div style={{fontFamily:"'Fredoka One',cursive",fontSize:28,color:C.gold,lineHeight:1}}>$3.99</div>
              <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",marginBottom:12}}>one-time · no subscription</div>
              <button onClick={()=>{setPendingClaimGame(gameCode);setUpgradeFrom('gameover');setScreen('upgrade');}} style={{...btnStyle(`linear-gradient(135deg, ${C.gold}, ${C.coral})`),width:"100%",fontSize:15,padding:"14px",borderRadius:50,color:C.dark,fontWeight:900}}>Upgrade to Game Night+</button>
              <button onClick={()=>{}} style={{background:"none",border:"none",color:"rgba(255,255,255,0.35)",fontSize:13,fontWeight:600,fontFamily:"'Nunito',sans-serif",cursor:"pointer",marginTop:10,padding:"4px"}}>No thanks, skip for now</button>
            </div>

            <IconGrid size={18} color="#fff"/> Full Scoreboard
          </button>
          <button onClick={()=>{setGameData(null);setGameCode("");setMyName("");setScreen("splash");}} style={{...btnStyle(`linear-gradient(135deg, ${C.coral}, ${C.pink})`),fontSize:16,padding:"16px",borderRadius:50,display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
            <IconTrain size={18} color="#fff"/> New Game
          </button>
        </div>
      </Screen>
    );
  }

  // ── FULL SCOREBOARD ────────────────────────────────────────────────────────
  if(screen==="fullboard"&&gameData){
    const rank=ranked;
    const roundPips=Array.from({length:startPip+1},(_,i)=>startPip-i);
    const grandTotal=players.reduce((s,n)=>s+(totals[n]||0),0);
    return(
      <Screen style={{background:C.dark}}>
        <div style={{padding:"calc(env(safe-area-inset-top) + 18px) 16px 16px",display:"flex",alignItems:"center",gap:12}}>
          <button onClick={()=>setScreen(gameData.status==="done"?"gameover":"scorecard")} style={{background:"rgba(255,255,255,0.09)",border:"none",color:"#fff",width:40,height:40,borderRadius:"50%",fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
          <div style={{flex:1}}>
            <div style={{fontFamily:"'Fredoka One',cursive",color:"#fff",fontSize:26}}>Full Scoreboard</div>
            <div style={{color:"rgba(255,255,255,0.4)",fontSize:12}}>Double-{startPip} · {players.length} players · Code: {gameCode}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{color:"rgba(255,255,255,0.4)",fontSize:10}}>ROUND</div>
            <div style={{fontFamily:"'Fredoka One',cursive",color:C.coral,fontSize:28}}>{currentRound}</div>
          </div>
        </div>
        <div style={{display:"flex",gap:10,padding:"4px 12px 12px",overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
          {rank.map((name,i)=>{
            const total=totals[name],wins=getWins(name),leader=totals[rank[0]];
            return(
              <div key={name} style={{minWidth:120,borderRadius:18,padding:"12px 14px",flexShrink:0,background:i===0?`linear-gradient(135deg, ${C.coral}, ${C.pink})`:"rgba(255,255,255,0.07)",border:i===0?"none":"1px solid rgba(255,255,255,0.09)"}}>
                <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:8}}>
                  <Avatar name={name} idx={players.indexOf(name)} size={28}/>

                </div>
                <div style={{fontFamily:"'Fredoka One',cursive",color:"#fff",fontSize:32,lineHeight:1}}>{total}</div>
                <div style={{color:"rgba(255,255,255,0.6)",fontSize:11,marginTop:4}}>{wins}W · {i===0?"Leader":`+${total-leader}`}</div>
              </div>
            );
          })}
        </div>
        <div style={{overflowX:"auto",WebkitOverflowScrolling:"touch",padding:"0 12px 12px"}}>
          <table style={{borderCollapse:"collapse",background:"rgba(255,255,255,0.03)",borderRadius:16,overflow:"hidden",width:"max-content",minWidth:"100%"}}>
            <thead>
              <tr>
                <th style={{padding:"9px 12px",textAlign:"left",color:"rgba(255,255,255,0.4)",fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:1,background:"rgba(255,255,255,0.07)",whiteSpace:"nowrap",position:"sticky",left:0,zIndex:2}}>Player</th>
                {roundPips.map(pip=><th key={pip} style={{padding:"9px 5px",textAlign:"center",color:pip===currentRound?C.gold:"rgba(255,255,255,0.3)",fontSize:10,fontWeight:800,background:"rgba(255,255,255,0.07)",minWidth:30}}>{pip}</th>)}
                <th style={{padding:"9px 7px",textAlign:"center",color:C.coral,fontSize:10,fontWeight:800,background:"rgba(255,255,255,0.07)"}}>RK</th>
                <th style={{padding:"9px 7px",textAlign:"center",color:"#fff",fontSize:10,fontWeight:800,background:"rgba(255,255,255,0.07)"}}>TOT</th>
                <th style={{padding:"9px 7px",textAlign:"center",color:C.lime,fontSize:10,fontWeight:800,background:"rgba(255,255,255,0.07)"}}>W</th>
              </tr>
            </thead>
            <tbody>
              {players.map((name,pi)=>{
                const total=totals[name],wins=getWins(name),rk=ranked.indexOf(name)+1;
                const leader=totals[ranked[0]];
                return(
                  <tr key={name} style={{background:pi%2===0?"rgba(255,255,255,0.025)":"transparent"}}>
                    <td style={{padding:"9px 12px",whiteSpace:"nowrap",position:"sticky",left:0,background:pi%2===0?"#1e1e30":"#1a1a2e",zIndex:1}}>
                      <div style={{display:"flex",alignItems:"center",gap:7}}>
                        <Avatar name={name} idx={players.indexOf(name)} size={26}/>
                        <span style={{color:name===myName?C.sky:"#fff",fontWeight:700,fontSize:13}}>{name}</span>
                      </div>
                    </td>
                    {roundPips.map(pip=>{
                      const s=getRound(name,pip),isWin=s===0,isMyScore=name===myName&&s!==null;
                      return(
                        <td key={pip} style={{padding:"7px 3px",textAlign:"center"}}>
                          {s!==null
                            ?<div
                                onClick={isMyScore?()=>{setSelected({});setCameraMode(false);setCameraScore(null);setEditingRound(pip);setScoringFor(name);setScreen("counter");}:undefined}
                                style={{display:"inline-block",minWidth:26,padding:"2px 3px",borderRadius:5,background:isWin?C.gold:"transparent",color:isWin?C.dark:"rgba(255,255,255,0.8)",fontWeight:isWin?900:400,fontSize:13,cursor:isMyScore?"pointer":"default",textDecoration:isMyScore&&!isWin?"underline dotted rgba(255,255,255,0.3)":"none"}}
                              >{s}</div>
                            :<span style={{color:"rgba(255,255,255,0.15)",fontSize:11}}>–</span>
                          }
                        </td>
                      );
                    })}
                    <td style={{padding:"7px 6px",textAlign:"center",fontFamily:"'Fredoka One',cursive",color:rk===1?C.gold:C.coral,fontSize:16}}>{rk}</td>
                    <td style={{padding:"7px 6px",textAlign:"center",fontFamily:"'Fredoka One',cursive",color:"#fff",fontSize:18}}>{total}</td>
                    <td style={{padding:"7px 6px",textAlign:"center",color:C.lime,fontWeight:800,fontSize:13}}>{wins}</td>
                  </tr>
                );
              })}
              <tr style={{borderTop:"1px solid rgba(255,255,255,0.09)"}}>
                <td style={{padding:"8px 12px",color:"rgba(255,255,255,0.3)",fontSize:11,fontWeight:800,position:"sticky",left:0,background:"#1a1a2e"}}>TOTAL</td>
                {roundPips.map(pip=>{
                  const s=players.reduce((sum,n)=>sum+(getRound(n,pip)||0),0);
                  const hasAny=players.some(n=>getRound(n,pip)!==null);
                  return<td key={pip} style={{padding:"7px 3px",textAlign:"center",color:"rgba(255,255,255,0.3)",fontSize:11}}>{hasAny?s:""}</td>;
                })}
                <td colSpan={2}/>
                <td style={{padding:"7px 6px",textAlign:"center",color:"rgba(255,255,255,0.4)",fontWeight:800,fontSize:13}}>{grandTotal}</td>
                <td/>
              </tr>
            </tbody>
          </table>
        </div>
      </Screen>
    );
  }

  // ── WELCOME ────────────────────────────────────────────────────────────────
  if(screen==="welcome"){
    const canSubmit=welcomeName.trim().length>0;
    async function saveProfile(){
      if(!canSubmit||!currentUser) return;
      const name=welcomeName.trim();
      const profile={
        name,avatarIdx:welcomeAvatar,createdAt:Date.now(),
        email:null,isPro:false,gamesPlayed:0,wins:0,totalScore:0,gameHistory:[],
      };
      await fb.set(fb.ref(fb.db,`profiles/${currentUser.uid}`),profile);
      setUserProfile(profile);
      setMyName(name);
      // Retroactive claim — if they came from a completed game, write results now
      if(pendingClaimGame){
        const snap=await fb.get(fb.ref(fb.db,`games/${pendingClaimGame}`));
        if(snap.exists()){
          const gd=snap.val();
          // Find which player slot matches their chosen name (best-effort)
          const matchedName=(gd.players??[]).find(p=>p.toLowerCase()===name.toLowerCase())||null;
          if(matchedName){
            const updates={};
            updates[`games/${pendingClaimGame}/playerUids/${matchedName}`]=currentUser.uid;
            await fb.update(fb.ref(fb.db),updates);
            await writeGameResults({...gd,playerUids:{...gd.playerUids,[matchedName]:currentUser.uid}});
          }
        }
        setPendingClaimGame(null);
      }
      setScreen("splash");
    }
    return(
      <Screen style={{background:`linear-gradient(160deg, ${C.dark} 0%, #2a1a3a 100%)`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"40px 24px",textAlign:"center"}}>
        <div style={{fontFamily:"'Fredoka One',cursive",fontSize:32,color:"#fff",marginBottom:6}}>Welcome!</div>
        <div style={{color:"rgba(255,255,255,0.5)",fontSize:15,marginBottom:32}}>Let's set up your player profile</div>
        <div style={{display:"flex",gap:10,marginBottom:28,justifyContent:"center",flexWrap:"wrap"}}>
          {AVATAR_BG.map((bg,i)=>(
            <div key={i} onClick={()=>setWelcomeAvatar(i)} style={{width:44,height:44,borderRadius:"50%",background:bg,cursor:"pointer",border:welcomeAvatar===i?"3px solid #fff":"3px solid transparent",boxShadow:welcomeAvatar===i?"0 0 0 2px rgba(255,255,255,0.5)":"none",transition:"all 0.15s"}}/>
          ))}
        </div>
        <div style={{width:"100%",maxWidth:320,marginBottom:12}}>
          <input
            value={welcomeName}
            onChange={e=>setWelcomeName(e.target.value)}
            placeholder="Your name"
            style={{width:"100%",padding:"16px",borderRadius:16,border:"2px solid rgba(255,255,255,0.2)",background:"rgba(255,255,255,0.08)",color:"#fff",fontSize:18,fontFamily:"'Nunito',sans-serif",outline:"none",textAlign:"center",boxSizing:"border-box"}}
            onKeyDown={e=>e.key==="Enter"&&saveProfile()}
          />
        </div>
        <button onClick={()=>{setUpgradeFrom('welcome');setScreen('upgrade');}} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 14px",borderRadius:12,background:`${C.gold}18`,border:"none",cursor:"pointer",marginBottom:28}}>
          <span style={{fontSize:14,color:C.gold}}>★</span>
          <span style={{color:C.gold,fontSize:13,fontWeight:700,fontFamily:"'Nunito',sans-serif"}}>Game Night+ saves your stats forever —</span>
          <span style={{color:C.gold,fontSize:13,fontWeight:900,fontFamily:"'Nunito',sans-serif",textDecoration:"underline"}}>learn more</span>
        </button>
        <button onClick={saveProfile} disabled={!canSubmit} style={{...btnStyle(canSubmit?`linear-gradient(135deg, ${C.teal}, #1a5f82)`:"#555"),width:"100%",maxWidth:320,fontSize:18,padding:"17px",borderRadius:50,opacity:canSubmit?1:0.5,cursor:canSubmit?"pointer":"not-allowed"}}>
          Let's Play →
        </button>
      </Screen>
    );
  }

  // ── SQUADS ─────────────────────────────────────────────────────────────────
  if(screen==="squads"){
    // saveSquads -> saveSquadsLS
    // savePlayers -> savePlayersLS
    const tabs=[['squads','Squads'],['players','Players']];
    return(
      <Screen style={{background:C.bg,display:"flex",flexDirection:"column"}}>
        <div style={{background:`linear-gradient(135deg, ${C.sky}, ${C.teal})`,padding:"calc(env(safe-area-inset-top) + 20px) 20px 20px",position:"relative",overflow:"hidden",flexShrink:0}}>
          <div style={{position:"absolute",bottom:-40,right:-40,width:140,height:140,borderRadius:"50%",background:"rgba(255,255,255,0.12)"}}/>
          <button onClick={()=>setScreen(squadsFrom)} style={{background:"rgba(255,255,255,0.22)",border:"none",color:"#fff",width:40,height:40,borderRadius:"50%",fontSize:18,cursor:"pointer",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <IconSquads size={26} color="#fff"/>
            <div>
              <div style={{fontFamily:"'Fredoka One',cursive",fontSize:28,color:"#fff",lineHeight:1}}>My Squads</div>
              <div style={{color:"rgba(255,255,255,0.8)",fontSize:13,marginTop:2}}>Your regular game groups &amp; players</div>
            </div>
          </div>
        </div>
        {/* Tab Nav */}
        <div style={{background:"#fff",borderBottom:"1px solid #eee",display:"flex",flexShrink:0,position:"sticky",top:0,zIndex:10}}>
          {tabs.map(([key,label])=>{
            const active=squadsTab===key;
            return(
              <button key={key} onClick={()=>setSquadsTab(key)} style={{flex:1,padding:"13px 4px",border:"none",background:"none",cursor:"pointer",fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:13,color:active?C.teal:C.muted,borderBottom:active?`3px solid ${C.teal}`:"3px solid transparent"}}>
                {label}
              </button>
            );
          })}
        </div>
        <div style={{flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch",padding:"14px 14px",paddingBottom:"calc(90px + env(safe-area-inset-bottom))"}}>

          {/* ── SQUADS TAB ── */}
          {squadsTab==='squads'&&(
            <div>
              <div style={{fontSize:11,fontWeight:800,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:2}}>Your squads</div>
              <div style={{fontSize:12,color:C.muted,marginBottom:14}}>Select a squad then tap Start Game — or tap Edit to manage members</div>
              {squads.length===0&&(

              {squads.map(sq=>{
                const isSelected=selectedSquad?.id===sq.id;
                return(
                  <div key={sq.id} onClick={()=>setSelectedSquad(isSelected?null:sq)} style={{background:"#fff",borderRadius:16,padding:"14px 16px",marginBottom:10,display:"flex",alignItems:"center",gap:12,boxShadow:isSelected?`0 4px 20px ${C.teal}33`:"0 2px 8px rgba(0,0,0,0.05)",border:`2px solid ${isSelected?C.teal:"transparent"}`,cursor:"pointer"}}>
                    <div style={{width:22,height:22,borderRadius:"50%",border:`2px solid ${isSelected?C.teal:"#ddd"}`,background:isSelected?C.teal:"transparent",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
                      {isSelected&&<div style={{width:8,height:8,borderRadius:"50%",background:"#fff"}}/>}
                    </div>
                    <div style={{display:"flex",marginRight:4}}>
                      {(sq.members||[]).slice(0,4).map((m,mi)=>(
                        <div key={mi} style={{marginLeft:mi>0?-8:0,zIndex:4-mi,position:"relative"}}>
                          <Avatar name={m} idx={mi} size={28}/>
                        </div>
                      ))}
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:800,fontSize:16,color:C.dark}}>{sq.name}</div>
                      <div style={{fontSize:12,color:C.muted}}>{sq.members?.length||0} players{sq.lastPlayed?` · ${new Date(sq.lastPlayed).toLocaleDateString()}`:" · Never played"}</div>
                    </div>
                    <button onClick={e=>{e.stopPropagation();setEditingSquad({...sq});setScreen('squadedit');}} style={{background:`${C.sky}18`,border:`1px solid ${C.sky}55`,borderRadius:8,padding:"6px 12px",cursor:"pointer",color:C.teal,fontSize:12,fontWeight:800,fontFamily:"'Nunito',sans-serif",flexShrink:0}}>Edit</button>
                  </div>
                );
              })}
              <button onClick={()=>{const ns={id:Date.now(),name:"New Squad",members:[],lastPlayed:null};setEditingSquad(ns);setScreen('squadedit');}} style={{width:"100%",padding:"14px",borderRadius:14,border:`2px dashed ${C.teal}88`,background:`${C.teal}08`,color:C.teal,fontSize:14,fontWeight:800,fontFamily:"'Nunito',sans-serif",cursor:"pointer",marginTop:4}}>+ New Squad</button>
            </div>
          )}

          {/* ── PLAYERS TAB ── */}
          {squadsTab==='players'&&(
            <div>
              <div style={{fontSize:11,fontWeight:800,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:2}}>All players</div>
              <div style={{fontSize:12,color:C.muted,marginBottom:14}}>Tap a player to view stats or edit their profile</div>
              {allPlayers.length===0&&(
                <div style={{textAlign:"center",padding:"32px 16px",color:C.muted,fontSize:14}}>No players yet. Add one below!</div>
              )}

  // ── SQUAD EDIT ─────────────────────────────────────────────────────────────
  if(screen==="squadedit"&&editingSquad){

                <div key={name} style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>

                  <button onClick={()=>setEditingSquad(prev=>({...prev,members:prev.members.filter(m=>m!==name)}))}
                    style={{background:`${C.coral}18`,border:`1px solid ${C.coral}55`,borderRadius:8,padding:"5px 10px",cursor:"pointer",color:C.coral,fontSize:12,fontWeight:800,fontFamily:"'Nunito',sans-serif"}}>− Remove</button>

              ))}
            </div>

            <button onClick={()=>{

            Save Squad

        </BottomBar>
      </Screen>
    );

  // ── PLAYER PROFILE ─────────────────────────────────────────────────────────
  if(screen==="profile"&&viewingPlayer){

    return(
      <Screen style={{background:C.bg}}>
        <div style={{background:`linear-gradient(135deg, ${AVATAR_BG[pIdx%AVATAR_BG.length]}, ${C.coral})`,padding:"calc(env(safe-area-inset-top) + 20px) 20px 36px",position:"relative",overflow:"hidden"}}>
          <div style={{position:"absolute",bottom:-40,right:-40,width:140,height:140,borderRadius:"50%",background:"rgba(255,255,255,0.12)"}}/>
          <button onClick={()=>setScreen("squads")} style={{background:"rgba(255,255,255,0.22)",border:"none",color:"#fff",width:40,height:40,borderRadius:"50%",fontSize:18,cursor:"pointer",marginBottom:14,display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <Avatar name={pl.name} idx={pIdx} size={54}/>

  // ── UPGRADE ────────────────────────────────────────────────────────────────

      <Screen style={{background:`linear-gradient(160deg, ${C.dark} 0%, #2a1a3a 100%)`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"40px 24px",textAlign:"center",position:"relative"}}>

        <div style={{color:"rgba(255,255,255,0.4)",fontSize:13,marginBottom:24}}>one-time · no subscription</div>

        </div>
      </Screen>

  // ── RULES ──────────────────────────────────────────────────────────────────
  if(screen==="rules"){
    const dealTables=[
      {
        set:12, total:91, note:"up to 8 players",
        rows:[["2–4","15","varies"],["5","12","26"],["6","11","20"],["7","10","14"],["8","9","10"]],
      },
      {
        set:9, total:55, note:"best for 2–4 players",
        rows:[["2","12","31"],["3","11","22"],["4","10","15"]],
      },
      {
        set:6, total:28, note:"short games, 2–4 players",
        rows:[["2","7","14"],["3","6","10"],["4","5","8"]],
      },
    ];
    const quickSteps=[
      {title:"Objective",text:"Be the player with the lowest score when the game ends. Each round, you score the total pips on tiles left in your hand."},
      {title:"Setup",text:"Shuffle all dominoes face down. Each player draws tiles based on player count. The remaining tiles form the 'boneyard'. Place the starting double (e.g. 12-12) face up in the center hub."},
      {title:"Starting a round",text:"The player with the highest double places it in the center. Each player must start their personal train by playing off that double. If a player cannot start their train, they draw from the boneyard until they can.",dealBtn:true},
      {title:"Taking a Turn",text:"On your turn you must play a tile on your own train, the Mexican Train, or any open (public) train. If you cannot play, draw one tile from the boneyard. If you still can't play, place a marker on your train making it public."},
      {title:"The Mexican Train",text:"Anyone can start or add to the Mexican Train, which also branches off the center hub. It is always public."},
      {title:"Going Out",text:"Play your last tile to go out. All other players count the pips remaining in their hand and record that as their score for the round. Playing a double-blank (0-0) scores 50 points."},
      {title:"Rounds",text:"Each round starts with the next lower double as the hub. A Double-12 game plays from 12-12 down to 0-0 for 13 rounds total. Choose 'Evens' or 'Odds' for a shorter game."},
      {title:"Winning",text:"After the final round (0-0), the player with the lowest total score wins!"},
    ];
    const variants=[
      {tag:"Scoring variant",tagBg:C.sky,title:"Round order",text:"Standard play goes 12 down to 0. Some groups prefer starting at 0 and working up to 12 — this changes which rounds feel easy vs. tense."},
      {tag:"Scoring variant",tagBg:C.sky,title:"Double-blank value",text:"Most rules count the double-blank as 0 points. Some groups score it as 50 — making it a high-stakes tile to be caught holding."},
      {tag:"Setup variant",tagBg:C.sky,title:"Starting tile",text:"Standard: draw from the boneyard until someone finds the engine tile. Some groups let whoever holds the highest double go first instead."},
      {tag:"Round variant",tagBg:C.sky,title:"Game length",text:"A full game is 13 rounds (12 down to 0). Popular shorter variants: 6 rounds or just 3 rounds for a quick game night."},
      {tag:"Doubles rule",tagBg:C.sky,title:"Open doubles (relaxed)",text:"Standard rules require an open double to be covered immediately — the very next player must play on it before anything else. Some groups drop this rule entirely and treat doubles like any other tile, removing the obligation. This speeds up the game but eliminates the tactical pressure of leaving a double exposed."},
      {tag:"House rule",tagBg:C.gold,title:"Forgetting \"uno\"",text:"When down to your last tile, announce it. If another player catches you forgetting before your next turn, common penalties are drawing 1 or 2 tiles. This happens at the table — agree before you start!"},
    ];
    const tabs=[['deal','Deal Chart'],['quick','Quick Rules'],['house','House Rules']];
    return(
      <Screen style={{background:C.bg,display:"flex",flexDirection:"column"}}>
        {/* Header */}
        <div style={{background:`linear-gradient(135deg, #1b7a72, #1a5f82)`,padding:"calc(env(safe-area-inset-top) + 20px) 20px 20px",position:"relative",overflow:"hidden",flexShrink:0}}>
          <div style={{position:"absolute",bottom:-40,right:-40,width:140,height:140,borderRadius:"50%",background:"rgba(255,255,255,0.12)"}}/>
          <button onClick={()=>setScreen(rulesFrom)} style={{background:"rgba(255,255,255,0.22)",border:"none",color:"#fff",width:40,height:40,borderRadius:"50%",fontSize:18,cursor:"pointer",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <IconRules size={26} color="#fff"/>
            <div>
              <div style={{fontFamily:"'Fredoka One',cursive",fontSize:28,color:"#fff",lineHeight:1}}>How to Play</div>
              <div style={{color:"rgba(255,255,255,0.85)",fontSize:13,marginTop:2}}>Mexican Train Dominoes</div>
            </div>

        <div style={{background:"#fff",borderBottom:"1px solid #eee",display:"flex",flexShrink:0,position:"sticky",top:0,zIndex:10}}>

        {/* Scrollable content */}
        <div ref={rulesScrollRef} style={{flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch",padding:"14px 14px 40px"}}>

          {/* ── DEAL CHART TAB ── */}
          {rulesTab==='deal'&&(
            <div>
              <div style={{background:`${C.sky}22`,border:`1px solid ${C.sky}66`,borderRadius:14,padding:"11px 14px",marginBottom:16,fontSize:13,color:C.dark,lineHeight:1.55}}>

                const hdr=PIP_COLOR[set];

                  <div key={set} style={{background:"#fff",borderRadius:16,overflow:"hidden",marginBottom:14,boxShadow:"0 2px 10px rgba(0,0,0,0.06)"}}>

                      <div style={{fontFamily:"'Fredoka One',cursive",color:"#fff",fontSize:18}}>Double-{set}</div>
                      <div style={{color:"rgba(255,255,255,0.8)",fontSize:11,fontWeight:700}}>{total} tiles · {note}</div>
                    </div>
                    <table style={{width:"100%",borderCollapse:"collapse"}}>
                      <thead>
                        <tr style={{background:"#f7f8fa"}}>
                          {["Players","Tiles each","Boneyard"].map(h=>(
                            <th key={h} style={{padding:"8px 12px",textAlign:"left",fontSize:11,fontWeight:800,color:C.muted,textTransform:"uppercase",letterSpacing:0.5}}>{h}</th>

                        ))}
                      </tbody>
                    </table>
                  </div>
                );
              })}
              <div style={{background:`${C.gold}22`,border:`1px solid ${C.gold}88`,borderRadius:14,padding:"11px 14px",fontSize:13,color:C.dark,lineHeight:1.55}}>
                💡 Playing with fewer players than the max? A bigger boneyard means more draws mid-game — rounds tend to last longer.
              </div>
            </div>
          )}

          {/* ── QUICK RULES TAB ── */}
          {rulesTab==='quick'&&(
            <div>
              {quickSteps.map((s,i)=>(
                <div key={i} style={{background:"#fff",borderRadius:16,padding:"14px 16px",marginBottom:10,boxShadow:"0 2px 10px rgba(0,0,0,0.05)",display:"flex",gap:12}}>
                  <div style={{flexShrink:0,width:26,height:26,borderRadius:"50%",background:`linear-gradient(135deg, #1b7a72, #1a5f82)`,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Fredoka One',cursive",fontSize:14,color:"#fff",marginTop:1}}>{i+1}</div>
                  <div style={{flex:1}}>
                    <div style={{fontFamily:"'Fredoka One',cursive",fontSize:16,color:C.teal,marginBottom:4}}>{s.title}</div>
                    <div style={{fontSize:14,color:"#444",lineHeight:1.6}}>{s.text}</div>
                    {s.dealBtn&&(
                      <button onClick={()=>switchRulesTab('deal')} style={{display:"inline-flex",alignItems:"center",gap:5,marginTop:8,padding:"6px 12px",borderRadius:50,background:`${C.teal}22`,border:`0.5px solid ${C.teal}`,color:C.teal,fontSize:11,fontWeight:800,fontFamily:"'Nunito',sans-serif",cursor:"pointer"}}>
                        See Deal Chart →
                      </button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* ── HOUSE RULES TAB ── */}
          {rulesTab==='house'&&(
            <div>
              <div style={{fontSize:11,fontWeight:800,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:10,paddingLeft:2}}>Variants &amp; House Rules</div>
              {variants.map((v,i)=>(
                <div key={i} style={{background:"#fff",borderRadius:16,padding:"14px 16px",marginBottom:10,boxShadow:"0 2px 10px rgba(0,0,0,0.05)"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                    <Badge label={v.tag} bg={v.tagBg}/>
                  </div>
                  <div style={{fontFamily:"'Fredoka One',cursive",fontSize:16,color:C.dark,marginBottom:4}}>{v.title}</div>
                  <div style={{fontSize:14,color:"#444",lineHeight:1.6}}>{v.text}</div>
                </div>
              ))}
            </div>
          )}

        </div>
      </Screen>
    );
  }

  // ── Loading ────────────────────────────────────────────────────────────────
  return(
    <Screen style={{background:`linear-gradient(160deg, ${C.dark} 0%, #2a1a3a 100%)`,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16}}>
      <div style={{width:48,height:48,borderRadius:12,background:`linear-gradient(135deg, ${C.coral}, ${C.pink})`,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <IconTrain size={26} color="#fff"/>
      </div>
      <div style={{fontFamily:"'Fredoka One',cursive",fontSize:20,color:"rgba(255,255,255,0.4)"}}>
        {authReady?"Loading...":"Starting up..."}
      </div>
    </Screen>
  );
}

// Mount after Firebase is ready
waitForFb(()=>{
  const root=ReactDOM.createRoot(document.getElementById("root"));
  root.render(React.createElement(App));
});
</script>
</body>
</html>
