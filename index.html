  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  for (let i = 0; i < 4; i++) c += chars[Math.floor(Math.random() * chars.length)];

// ── Components ─────────────────────────────────────────────────────────────
// Domino renders a single half-tile (square) using the exact SVG spec
function Domino({value,size=80,selected=false,count=0,onClick}){
  const pc=PIP_COLOR[value]??"#222";
  const isBlank=value===0;
  const r=value>=10?5.4:6;
  const data=DOMINO_PIPS[value]??{L:[],R:[]};
  // Render left half only (square tile) cropped to 38,26,67.5,68
  const aspect=67.5/68;
  const w=size;
  const h=Math.round(size/aspect);
  return(
    <div onClick={onClick} style={{position:"relative",display:"inline-block",cursor:onClick?"pointer":"default",WebkitUserSelect:"none",userSelect:"none"}}>
      <div style={{width:w,height:h,background:selected?(isBlank?"#fff8e1":"#fffaf0"):"#fff",border:`3px solid ${selected?(isBlank?C.gold:pc):"#e4e4e4"}`,boxShadow:selected?`0 0 0 3px ${isBlank?C.gold:pc}44, 0 6px 20px ${isBlank?C.gold:pc}28`:"0 2px 8px rgba(0,0,0,0.07)",borderRadius:size*0.1,transition:"transform 0.12s, box-shadow 0.12s",transform:selected?"scale(1.06)":"scale(1)",minWidth:44,minHeight:44,overflow:"hidden"}}>
        <svg width="100%" height="100%" viewBox="38 26 67.5 68" style={{display:"block"}}>
          <path d={LEFT_PATH} fill="none" stroke="#e4e4e4" strokeWidth="0.5"/>
          {isBlank
            ?<line x1="48" y1="60" x2="96" y2="60" stroke="#ccc" strokeWidth="3" strokeLinecap="round"/>
            :data.L.map(([cx,cy],i)=><circle key={i} cx={cx} cy={cy} r={r} fill={pc}/>)
          }
        </svg>
      </div>
      {count>0&&<div style={{position:"absolute",top:-9,right:-9,width:24,height:24,borderRadius:"50%",background:C.coral,color:"#fff",fontSize:13,fontWeight:900,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 2px 6px rgba(0,0,0,0.25)",border:"2px solid #fff"}}>{count}</div>}
    </div>
  );
}

// ── localStorage helper ────────────────────────────────────────────────────
function useLS(key,initial){
  const [val,setVal]=useState(function(){
    try{ var s=localStorage.getItem(key); return s?JSON.parse(s):initial; }catch(e){ return initial; }
  });
  function save(v){ setVal(v); try{ localStorage.setItem(key,JSON.stringify(v)); }catch(e){} }
  return [val,save];
}

  // Derived
  const startPip     = gameData?.startPip??12;

    const names=setupPlayers.map(p=>p.name.trim()).filter(Boolean);

    const code=genCode();

    // Build round list respecting roundOrder and gameLength
    let allRounds=Array.from({length:setupPip+1},(_,i)=>setupPip-i); // [12..0] desc
    if(houseRules.roundOrder==='asc') allRounds=[...allRounds].reverse(); // [0..12]

    else if(houseRules.gameLength==='3') allRounds=allRounds.slice(0,3);
    const playerUids={};
    if(currentUser) playerUids[names[0]]=currentUser.uid;
    await fb.set(fb.ref(fb.db,`games/${code}`),{
      startPip:setupPip,
      currentRound:allRounds[0],
      roundsList:allRounds,
      status:"active",players:names,

  async function submitScore(score){
    const targetRound = editingRound !== null ? editingRound : currentRound;
    const targetPlayer = scoringFor || myName;
    const ridx=String(startPip-targetRound);
    const updates={};
    updates[`games/${gameCode}/scores/${targetPlayer}/${ridx}`]=score;
    if(editingRound===null){
      const allDone=players.every(p=>p===targetPlayer?true:scores[p]?.[ridx]!=null);

        const roundsList=gameData?.roundsList??[];

        if(nextRound!=null) updates[`games/${gameCode}/currentRound`]=nextRound;

  async function writeGameResults(data){
    const finalPlayers=data.players??[];
    const finalScores=data.scores??{};
    const finalUids=data.playerUids??{};
    const finalTotals=Object.fromEntries(finalPlayers.map(n=>[n,Object.values(finalScores[n]??{}).reduce((a,b)=>a+(b||0),0)]));
    const placement=finalPlayers.slice().sort((a,b)=>finalTotals[a]-finalTotals[b]);
    const winner=placement[0];
    const updates={};
    finalPlayers.forEach(function(name){
      const uid=finalUids[name];
      if(!uid) return;
      const myScore=finalTotals[name]??0;
      const myPlacement=placement.indexOf(name)+1;
      updates[`profiles/${uid}/gamesPlayed`]=fb.increment(1);
      if(name===winner) updates[`profiles/${uid}/wins`]=fb.increment(1);
      updates[`profiles/${uid}/totalScore`]=fb.increment(myScore);
    });
    if(Object.keys(updates).length>0) await fb.update(fb.ref(fb.db),updates);
    // Append game history entries separately (can't use increment on arrays)
    finalPlayers.forEach(function(name){
      const uid=finalUids[name];
      if(!uid) return;
      const myScore=finalTotals[name]??0;
      const myPlacement=placement.indexOf(name)+1;
      // Detect if this game's players match a saved squad
      const matchedSquad=squads.find(sq=>sq.members&&finalPlayers.length===sq.members.length&&finalPlayers.every(p=>sq.members.includes(p)));
      const historyEntry={gameCode:data.gameCode||gameCode,date:Date.now(),players:finalPlayers,scores:finalScores,startPip:data.startPip??12,myScore,placement:myPlacement,squadName:matchedSquad?.name||null};

        const existing=snap.exists()?snap.val():[];
        const arr=Array.isArray(existing)?existing:Object.values(existing);
        arr.push(historyEntry);
        fb.update(fb.ref(fb.db),{[`profiles/${uid}/gameHistory`]:arr.slice(-20)});
      });
    });

      </div>
      <div style={{fontFamily:"'Fredoka One',cursive",fontSize:"clamp(28px,8vw,42px)",color:"#fff",lineHeight:1.15,marginBottom:6,textAlign:"center"}}>Mexican Train<br/>Game Night</div>

      <div style={{display:"flex",flexDirection:"column",gap:12,width:"100%",maxWidth:320}}>
        <button onClick={()=>navigate("setup")} style={{...btnStyle(`linear-gradient(135deg, ${C.coral}, ${C.pink})`),padding:"16px 20px",borderRadius:20,boxShadow:`0 8px 32px ${C.pink}55`,display:"flex",alignItems:"center",gap:14,textAlign:"left"}}>

            <div style={{fontSize:17,fontWeight:900,letterSpacing:0.3,lineHeight:1.2}}>New Game</div>

          </div>
        </button>
        <button onClick={()=>navigate("join")} style={{...btnStyle("rgba(255,255,255,0.12)"),padding:"16px 20px",borderRadius:20,border:"2px solid rgba(255,255,255,0.2)",display:"flex",alignItems:"center",gap:14,textAlign:"left"}}>

            <div style={{fontSize:17,fontWeight:900,letterSpacing:0.3,lineHeight:1.2}}>Join Game</div>

          </div>
        </button>
        <button onClick={()=>navigate("squads")} style={{...btnStyle("rgba(255,255,255,0.08)"),padding:"16px 20px",borderRadius:20,border:"2px solid rgba(255,255,255,0.2)",display:"flex",alignItems:"center",gap:14,textAlign:"left"}}>
          <IconSquads size={26} color="#fff"/>
          <div style={{flex:1}}>
            <div style={{fontSize:17,fontWeight:900,letterSpacing:0.3,lineHeight:1.2}}>My Squads</div>
            <div style={{fontSize:12,fontWeight:600,opacity:0.7,marginTop:2}}>manage your regular game groups</div>
          </div>

          <div key={i} style={{width:36,height:10,background:c}}/>

  );

  // ── JOIN ───────────────────────────────────────────────────────────────────
  if(screen==="join") return(
    <Screen style={{background:C.bg}}>
      <div style={{background:GR.onboarding,padding:"calc(env(safe-area-inset-top) + 16px) 18px 14px"}}>
        <button onClick={()=>goBack()} style={{background:"rgba(255,255,255,0.22)",border:"none",color:"#fff",width:38,height:38,borderRadius:"50%",fontSize:18,cursor:"pointer",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <IconUsers size={24} color="#fff"/>
          <div>
            <div style={{fontFamily:"'Fredoka One',cursive",fontSize:26,color:"#fff",lineHeight:1}}>Join a Game</div>
            <div style={{color:"rgba(255,255,255,0.85)",fontSize:13,marginTop:2}}>Enter the 4-letter code from your host</div>
          </div>
        </div>
      </div>

      <div style={{margin:"10px 12px 0",background:"#fff",borderRadius:18,padding:"24px 20px",boxShadow:"0 2px 12px rgba(0,0,0,0.06)"}}>
        <input
          value={joinInput}
          onChange={e=>{setJoinInput(e.target.value.toUpperCase());setJoinError("");}}
          placeholder="ABCD"
          maxLength={4}
          style={{width:"100%",padding:"18px",borderRadius:16,border:`2.5px solid ${joinError?C.coral:C.sky}`,fontSize:32,fontFamily:"'Fredoka One',cursive",textAlign:"center",letterSpacing:12,outline:"none",color:C.dark,boxSizing:"border-box"}}
          onKeyDown={e=>e.key==="Enter"&&lookupGame()}
        />
        {joinError&&<div style={{color:C.coral,fontSize:13,fontWeight:700,textAlign:"center",marginTop:8}}>{joinError}</div>}
        <button onClick={lookupGame} style={{...btnStyle(`linear-gradient(135deg, ${C.teal}, ${C.sky})`),width:"100%",marginTop:16,fontSize:17,padding:"16px",borderRadius:50,display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
          <IconUsers size={20} color="#fff"/> Find Game
        </button>
      </div>
    </Screen>
  );

  // ── SETUP ──────────────────────────────────────────────────────────────────
  if(screen==="setup"){
    const playerNames=setupPlayers.map(p=>p.name.trim()).filter(Boolean);
    return(
      <Screen style={{background:C.bg}}>
        {/* Compact header */}
        <div style={{background:GR.onboarding,padding:"calc(env(safe-area-inset-top) + 16px) 18px 14px"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
            <button onClick={()=>goBack()} style={{background:"rgba(255,255,255,0.22)",border:"none",color:"#fff",width:38,height:38,borderRadius:"50%",fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
            <button onClick={()=>{setRulesFrom('setup');setRulesTab('deal');navigate("rules");}} style={{background:"rgba(255,255,255,0.22)",border:"none",color:"#fff",borderRadius:50,padding:"7px 16px",fontSize:13,fontWeight:800,fontFamily:"'Nunito',sans-serif",cursor:"pointer",display:"flex",alignItems:"center",gap:6}}><IconRules size={15} color="#fff"/> Rules</button>
          </div>
          <div style={{fontFamily:"'Fredoka One',cursive",fontSize:26,color:"#fff",lineHeight:1}}>Game Setup</div>
          <div style={{color:"rgba(255,255,255,0.85)",fontSize:13,marginTop:3}}>Configure your game</div>
        </div>
        <ColorBar colors={skin.bar}/>

        {/* Single card with section dividers */}
        <div style={{margin:"10px 12px 24px",background:"#fff",borderRadius:18,overflow:"hidden",boxShadow:"0 2px 12px rgba(0,0,0,0.06)"}}>

          {/* Domino Set */}
          <div style={{padding:"16px 16px 14px",borderBottom:"1.5px solid #f0f0f0"}}>
            <div style={{fontWeight:800,fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:0.5,marginBottom:12}}>Domino Set</div>
            <div style={{display:"flex",gap:8}}>
              {[12,9,6].map(p=>{
                const pc=PIP_COLOR[p]??"#333",active=setupPip===p;
                return(
                  <button key={p} onClick={()=>setSetupPip(p)} style={{flex:1,padding:"10px 6px 8px",borderRadius:12,border:`2.5px solid ${active?pc:"#eee"}`,background:active?`${pc}14`:"#fafafa",cursor:"pointer",fontFamily:"'Nunito',sans-serif",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:6}}>
                    <DoubleDomino value={p} height={30}/>
                    <div style={{fontSize:11,fontWeight:800,color:active?pc:C.muted}}>Double-{p}</div>
                  </button>
                );
              })}
            </div>
          </div>

          {/* House Rules — no Starting Tile */}
          <div style={{padding:"14px 16px",borderBottom:"1.5px solid #f0f0f0"}}>
            <div style={{fontWeight:800,fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:0.5,marginBottom:3}}>House Rules</div>
            <div style={{fontSize:12,color:C.muted,marginBottom:12}}>Settle any rule debates before you start</div>
            {[
              {label:"Round order", key:"roundOrder", opts:[{v:'desc',l:'12→0'},{v:'asc',l:'0→12'}]},
              {label:"Double-blank", key:"blankValue", opts:[{v:0,l:'0 pts'},{v:50,l:'50 pts'}]},
              {label:"Game length", key:"gameLength", opts:[{v:'3',l:'3 rounds'},{v:'6',l:'6 rounds'},{v:'all',l:'All'}]},
            ].map(({label,key,opts})=>(
              <div key={key} style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,gap:8}}>
                <div style={{fontSize:14,fontWeight:700,color:C.dark,flexShrink:0}}>{label}</div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"flex-end"}}>
                  {opts.map(({v,l})=>{
                    const active=houseRules[key]===v;
                    return(
                      <button key={String(v)} onClick={()=>setHouseRules(prev=>({...prev,[key]:v}))}
                        style={{padding:"6px 12px",borderRadius:50,border:`1.5px solid ${active?C.teal:"#ddd"}`,background:active?`${C.teal}18`:"#fafafa",color:active?C.teal:C.muted,fontSize:12,fontWeight:800,fontFamily:"'Nunito',sans-serif",cursor:"pointer",whiteSpace:"nowrap"}}>
                        {l}
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>

          {/* Load a Squad */}
          {squads.length>0&&(
            <div style={{padding:"14px 16px",borderBottom:"1.5px solid #f0f0f0"}}>
              <div style={{fontWeight:800,fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:0.5,marginBottom:10}}>Load a Squad</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {squads.map(sq=>(
                  <button key={sq.id} onClick={()=>setSetupPlayers(sq.members.map(n=>({name:n})))}
                    style={{padding:"7px 14px",borderRadius:50,border:`1.5px solid ${C.teal}88`,background:`${C.teal}10`,color:C.teal,fontSize:13,fontWeight:800,fontFamily:"'Nunito',sans-serif",cursor:"pointer"}}>
                    {sq.name}
                  </button>
                ))}
                <button onClick={()=>{setSquadsFrom('setup');navigate('squads');}}
                  style={{padding:"7px 14px",borderRadius:50,border:`1.5px dashed ${C.teal}`,background:"transparent",color:C.teal,fontSize:13,fontWeight:800,fontFamily:"'Nunito',sans-serif",cursor:"pointer"}}>
                  + Squads
                </button>
              </div>
            </div>
          )}

          {/* Players */}
          <div style={{padding:"14px 16px 16px"}}>
            <div style={{fontWeight:800,fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:0.5,marginBottom:12}}>Players</div>
            {setupPlayers.map((p,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                <Avatar name={p.name||"?"} idx={i} size={40}/>
                <input
                  value={p.name}
                  onChange={e=>setSetupPlayers(prev=>prev.map((pl,j)=>j===i?{...pl,name:e.target.value}:pl))}
                  placeholder={`Player ${i+1}`}
                  style={{flex:1,padding:"13px 16px",borderRadius:12,border:"2px solid #eee",fontSize:16,fontFamily:"'Nunito',sans-serif",outline:"none",minHeight:48,background:"#fff"}}
                />
                {setupPlayers.length>2&&(
                  <button onClick={()=>setSetupPlayers(prev=>prev.filter((_,j)=>j!==i))} style={{background:"none",border:"none",color:"#ccc",fontSize:22,cursor:"pointer",width:40,height:40,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
                )}
              </div>
            ))}
            {setupPlayers.length<8&&(
              <button onClick={()=>setSetupPlayers(prev=>[...prev,{name:""}])} style={{width:"100%",padding:"13px",borderRadius:12,minHeight:48,border:`2px dashed ${C.sky}99`,background:`${C.sky}0a`,color:C.sky,fontSize:14,fontWeight:800,cursor:"pointer",marginTop:4}}>+ Add Player</button>
            )}
            <button onClick={createGame} disabled={playerNames.length<2} style={{...btnStyle(playerNames.length<2?"#ddd":`linear-gradient(135deg, ${C.coral}, ${C.pink})`),width:"100%",marginTop:20,fontSize:18,padding:"17px",borderRadius:50,letterSpacing:1,boxShadow:playerNames.length<2?"none":`0 6px 24px ${C.pink}44`,cursor:playerNames.length<2?"not-allowed":"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
              <IconTrain size={22} color="#fff"/> Create Game
            </button>
          </div>

        </div>
      </Screen>
    );
  }

  // ── PICK NAME ──────────────────────────────────────────────────────────────
  if(screen==="pickname"){
    const playerList=gameData?.players??[];
    const profileName=userProfile?.name??"";
    const isPro=userProfile?.isPro===true;

    async function claimSlot(hostName){
      const updates={};
      const finalName=isPro&&profileName&&profileName!==hostName?profileName:hostName;
      if(isPro&&profileName&&profileName!==hostName){
        const updatedPlayers=playerList.map(n=>n===hostName?profileName:n);
        const updatedScores={};
        Object.entries(gameData.scores??{}).forEach(([k,v])=>{
          updatedScores[k===hostName?profileName:k]=v;
        });
        updates[`games/${gameCode}/players`]=updatedPlayers;
        updates[`games/${gameCode}/scores`]=updatedScores;
      }
      if(currentUser) updates[`games/${gameCode}/playerUids/${finalName}`]=currentUser.uid;
      // Write host scoring preference at join time
      updates[`games/${gameCode}/playerPrefs/${finalName}/allowHostScore`]=pendingAllowHost;
      await fb.update(fb.ref(fb.db),updates);
      setMyName(finalName);
      setSelectedName(null);
      navigate("scorecard");
    }

    async function addMyselfToGame(){
      if(!isPro||!profileName) return;
      const updatedPlayers=[...playerList,profileName];
      const updatedScores={...(gameData.scores??{}),[profileName]:{}};
      const updates={
        [`games/${gameCode}/players`]:updatedPlayers,
        [`games/${gameCode}/scores`]:updatedScores,
        [`games/${gameCode}/playerUids/${profileName}`]:currentUser.uid,
        [`games/${gameCode}/playerPrefs/${profileName}/allowHostScore`]:pendingAllowHost,
      };
      await fb.update(fb.ref(fb.db),updates);
      setMyName(profileName);
      navigate("scorecard");
    }

    return(
      <Screen style={{background:C.bg}}>
        <div style={{background:GR.onboarding,padding:"calc(env(safe-area-inset-top) + 20px) 20px 24px",position:"relative"}}>
          <div style={{position:"absolute",bottom:-40,right:-40,width:140,height:140,borderRadius:"50%",background:"rgba(255,255,255,0.12)",pointerEvents:"none"}}/>
          <div style={{fontFamily:"'Fredoka One',cursive",fontSize:30,color:"#fff"}}>Who are you?</div>
          <div style={{color:"rgba(255,255,255,0.85)",fontSize:13,marginTop:4}}>Tap your name to join</div>
          {/* Full-width share/invite button */}
          <button onClick={shareInvite} style={{display:"flex",alignItems:"center",gap:10,marginTop:14,background:"rgba(255,255,255,0.2)",border:"none",borderRadius:50,padding:"9px 18px",cursor:"pointer",width:"100%",touchAction:"manipulation",WebkitTapHighlightColor:"transparent"}}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            <span style={{color:"rgba(255,255,255,0.75)",fontSize:12,fontWeight:700,letterSpacing:0.5}}>Invite others</span>
            <span style={{fontFamily:"'Fredoka One',cursive",color:"#fff",fontSize:22,letterSpacing:4,flex:1,textAlign:"center"}}>{gameCode}</span>
            <span style={{color:"rgba(255,255,255,0.6)",fontSize:12,fontWeight:700}}>{copied?"Copied!":"Tap to share"}</span>
          </button>
        </div>
        <ColorBar colors={skin.bar}/>
        <div style={{margin:"10px 14px 0",background:"#fff",borderRadius:22,padding:"12px 16px",boxShadow:"0 4px 24px rgba(0,0,0,0.07)"}}>
          {playerList.map((name,i)=>{
            const isSelected=selectedName===name;
            return(
              <div key={name} style={{marginBottom:10,borderRadius:16,border:`2px solid ${isSelected?C.sky:C.sky+"33"}`,background:isSelected?`${C.sky}10`:`${C.sky}08`,overflow:"hidden",transition:"border-color 0.15s"}}>
                {/* Name row — always visible */}
                <button onClick={()=>setSelectedName(isSelected?null:name)} style={{width:"100%",display:"flex",alignItems:"center",gap:14,padding:"12px 14px",background:"transparent",border:"none",cursor:"pointer",fontFamily:"'Nunito',sans-serif",textAlign:"left"}}>
                  <Avatar name={name} idx={i} size={44}/>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:800,fontSize:17,color:C.dark}}>{name}</div>
                    {isPro&&profileName&&profileName!==name&&(
                      <div style={{fontSize:11,color:C.teal,fontWeight:700,marginTop:1}}>Will join as {profileName}</div>
                    )}
                    {isSelected&&<div style={{fontSize:11,color:C.teal,fontWeight:700,marginTop:1}}>That's me ✓</div>}
                  </div>
                  {!isSelected&&<div style={{color:C.sky,fontSize:13,fontWeight:700,flexShrink:0}}>That's me →</div>}
                </button>
                {/* Expanded: host toggle + join button */}
                {isSelected&&(
                  <>
                    <div style={{height:1,background:`${C.sky}22`,margin:"0 14px"}}/>
                    <div style={{padding:"12px 14px"}}>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,marginBottom:12}}>
                        <div>
                          <div style={{fontSize:13,fontWeight:700,color:C.dark}}>Allow host to score for me</div>
                          <div style={{fontSize:11,color:C.muted,marginTop:2}}>Useful if you can't reach your phone</div>
                        </div>
                        {/* Toggle */}
                        <div onClick={()=>setPendingAllowHost(v=>!v)}
                          style={{width:44,height:24,borderRadius:12,background:pendingAllowHost?C.teal:"#ddd",position:"relative",cursor:"pointer",flexShrink:0,transition:"background 0.2s",touchAction:"manipulation",WebkitTapHighlightColor:"transparent"}}>
                          <div style={{position:"absolute",top:3,left:pendingAllowHost?20:3,width:18,height:18,borderRadius:"50%",background:"#fff",transition:"left 0.2s",boxShadow:"0 1px 4px rgba(0,0,0,0.2)"}}/>
                        </div>
                      </div>
                      <button onClick={()=>claimSlot(name)} style={{...btnStyle(`linear-gradient(135deg, ${C.sky}, ${C.teal})`),width:"100%",padding:"13px",borderRadius:50,fontSize:15,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                        Join Game →
                      </button>
                    </div>
                  </>
                )}
              </div>
            );
          })}
          {isPro&&profileName&&!playerList.includes(profileName)&&(
            <div style={{marginBottom:10,borderRadius:16,border:`2px solid ${C.gold}55`,background:`${C.gold}0a`,overflow:"hidden"}}>
              <button onClick={()=>setSelectedName("__pro__")} style={{width:"100%",display:"flex",alignItems:"center",gap:14,padding:"12px 14px",background:"transparent",border:"none",cursor:"pointer",fontFamily:"'Nunito',sans-serif",textAlign:"left"}}>
                <Avatar name={profileName} idx={7} size={44}/>
                <div style={{flex:1}}>
                  <div style={{fontWeight:800,fontSize:17,color:C.dark}}>{profileName}</div>
                  <div style={{fontSize:11,color:C.gold,fontWeight:700,marginTop:1}}>Game Night+ — add yourself</div>
                </div>
                {selectedName!=="__pro__"&&<div style={{color:C.gold,fontSize:13,fontWeight:700,flexShrink:0}}>Join →</div>}
              </button>
              {selectedName==="__pro__"&&(
                <>
                  <div style={{height:1,background:`${C.gold}33`,margin:"0 14px"}}/>
                  <div style={{padding:"12px 14px"}}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,marginBottom:12}}>
                      <div>
                        <div style={{fontSize:13,fontWeight:700,color:C.dark}}>Allow host to score for me</div>
                        <div style={{fontSize:11,color:C.muted,marginTop:2}}>Useful if you can't reach your phone</div>
                      </div>
                      <div onClick={()=>setPendingAllowHost(v=>!v)}
                        style={{width:44,height:24,borderRadius:12,background:pendingAllowHost?C.teal:"#ddd",position:"relative",cursor:"pointer",flexShrink:0,transition:"background 0.2s",touchAction:"manipulation",WebkitTapHighlightColor:"transparent"}}>
                        <div style={{position:"absolute",top:3,left:pendingAllowHost?20:3,width:18,height:18,borderRadius:"50%",background:"#fff",transition:"left 0.2s",boxShadow:"0 1px 4px rgba(0,0,0,0.2)"}}/>
                      </div>
                    </div>
                    <button onClick={addMyselfToGame} style={{...btnStyle(`linear-gradient(135deg, ${C.gold}, ${C.coral})`),width:"100%",padding:"13px",borderRadius:50,fontSize:15,display:"flex",alignItems:"center",justifyContent:"center",gap:8,color:C.dark}}>
                      Join Game →
                    </button>
                  </div>
                </>
              )}
            </div>
          )}
          <div style={{marginTop:4,padding:"10px 14px",background:"#f7f8fa",borderRadius:12,fontSize:12,color:C.muted,textAlign:"center",lineHeight:1.5}}>
            Share code <strong style={{color:C.dark}}>{gameCode}</strong> so others can join from their phone
          </div>
        </div>
      </Screen>
    );
  }

  // ── SCORECARD ──────────────────────────────────────────────────────────────
  if(screen==="scorecard"&&gameData){
    const rank=ranked;
    return(
      <div style={{background:C.bg,display:"flex",flexDirection:"column",height:"100dvh",overflow:"hidden",fontFamily:"'Nunito',sans-serif"}}>
        {/* Compact header — 3-column grid for true centering */}
        <div style={{background:GR.ingame,padding:"calc(env(safe-area-inset-top) + 14px) 18px 12px",flexShrink:0}}>
          <div style={{position:"relative",display:"flex",alignItems:"center",justifyContent:"center",minHeight:72}}>
            {/* Left: round label — absolutely left */}
            <div style={{position:"absolute",left:0,display:"flex",flexDirection:"column",alignItems:"center",textAlign:"center",minWidth:64}}>
              <div style={{fontSize:9,fontWeight:800,color:"rgba(255,255,255,0.65)",letterSpacing:2,textTransform:"uppercase",lineHeight:1.3}}>ROUND</div>
              <div style={{fontFamily:"'Fredoka One',cursive",fontSize:54,color:"#fff",lineHeight:1}}>{currentRound}</div>
              <div style={{color:"rgba(255,255,255,0.55)",fontSize:11,fontWeight:700,lineHeight:1.3}}>of {startPip}</div>
            </div>
            {/* Center: domino — truly centered */}
            <DoubleDomino value={Math.min(currentRound,12)} height={44}/>
            {/* Right: invite share button */}
            <div style={{position:"absolute",right:0}}>
              <button onClick={shareInvite} style={{background:"rgba(255,255,255,0.18)",border:"none",borderRadius:50,padding:"6px 14px",cursor:"pointer",textAlign:"center",touchAction:"manipulation",WebkitTapHighlightColor:"transparent"}}>
                <div style={{fontSize:8,fontWeight:700,color:"rgba(255,255,255,0.65)",letterSpacing:1,display:"flex",alignItems:"center",gap:3,justifyContent:"center"}}>
                  <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.65)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                  {copied?"COPIED!":"INVITE"}
                </div>
                <div style={{fontFamily:"'Fredoka One',cursive",color:"#fff",fontSize:18,letterSpacing:3,lineHeight:1.1}}>{gameCode}</div>
              </button>
            </div>
          </div>
          {copied&&<div style={{textAlign:"center",color:"rgba(255,255,255,0.7)",fontSize:11,marginTop:4}}>Copied!</div>}
        </div>
        <ColorBar colors={skin.bar}/>
        <div style={{padding:"10px 12px 4px",flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch"}}>
          {rank.map((name,i)=>{
            const total=totals[name],wins=getWins(name);
            const hasScore=scores[name]?.[String(roundIdx)]!=null;
            const gap=total-totals[rank[0]];
            const isMe=name===myName;
            const allowHost=gameData?.playerPrefs?.[name]?.allowHostScore===true;
            const canScore=isMe||(isHost&&(name===gameData?.hostName||allowHost));
            return(
              <div key={name} style={{background:skin.cardBg||"#fff",borderRadius:20,padding:"12px 14px",marginBottom:8,display:"flex",alignItems:"center",gap:10,boxShadow:isMe?`0 4px 20px ${C.sky}33`:i===0?`0 4px 20px ${C.coral}22`:"0 2px 10px rgba(0,0,0,0.05)",border:isMe?`2px solid ${C.sky}55`:i===0?`2px solid ${C.coral}33`:"2px solid transparent"}}>
                <div style={{fontFamily:"'Fredoka One',cursive",fontSize:20,color:i===0?C.coral:"#bbb",width:22,flexShrink:0}}>{i+1}</div>
                <div onClick={()=>goToProfile(name)} style={{flexShrink:0,cursor:"pointer"}}><Avatar name={name} {...avatarProps(name,players.indexOf(name))} size={42}/></div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:800,fontSize:15,color:C.dark,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                    {name} {isMe&&<span style={{fontSize:11,color:C.sky,fontWeight:700}}>(you)</span>}
                    {isHost&&!isMe&&<span style={{fontSize:10,color:C.coral,fontWeight:700}}> ★</span>}
                  </div>
                  <div style={{fontSize:11,marginTop:2,display:"flex",gap:4,flexWrap:"wrap",alignItems:"center"}}>
                    <Badge label={wins===1?"1 win":`${wins} wins`} bg={C.lime}/>
                    {i===0
                      ?<Badge label="Leading" bg={C.gold}/>
                      :gap>0?<Badge label={`${gap} behind`} bg="#f0f0f0"/>:null
                    }
                    {isMe&&!isHost&&(
                      <button onClick={()=>{
                        const updates={};
                        updates[`games/${gameCode}/playerPrefs/${myName}/allowHostScore`]=!allowHost;
                        fb.update(fb.ref(fb.db),updates);
                      }} style={{display:"flex",alignItems:"center",gap:4,background:allowHost?`${C.teal}18`:"#f0f0f0",border:`1px solid ${allowHost?C.teal+"44":"#ddd"}`,borderRadius:50,padding:"3px 8px",cursor:"pointer",fontFamily:"'Nunito',sans-serif",WebkitTapHighlightColor:"transparent",touchAction:"manipulation"}}>
                        <div style={{width:7,height:7,borderRadius:"50%",background:allowHost?C.teal:"#bbb",flexShrink:0}}/>
                        <span style={{fontSize:10,fontWeight:800,color:allowHost?C.teal:C.muted,whiteSpace:"nowrap"}}>{allowHost?"Host: on":"Host: off"}</span>
                      </button>
                    )}
                  </div>
                </div>
                {/* Fixed-width score column so it never shifts */}
                <div style={{width:40,textAlign:"right",flexShrink:0,fontFamily:"'Fredoka One',cursive",fontSize:28,color:C.dark}}>{total}</div>
                {/* Fixed-width action column */}
                <div style={{width:64,flexShrink:0,display:"flex",justifyContent:"flex-end"}}>
                  {hasScore
                    ? canScore
                      ? <button onClick={()=>{setSelected({});setCameraMode(false);setCameraScore(null);setEditingRound(currentRound);setScoringFor(name);navigate("counter");}} style={{background:`${C.teal}18`,border:`1.5px solid ${C.teal}55`,borderRadius:10,padding:"6px 10px",cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>
                          <span style={{fontSize:14,color:C.teal}}>✓</span>
                          <span style={{fontSize:11,color:C.teal,fontWeight:800,fontFamily:"'Nunito',sans-serif"}}>Edit</span>
                        </button>
                      : <div style={{fontSize:20,color:C.teal}}>✓</div>
                    : canScore
                      ? <button onClick={()=>{setSelected({});setCameraMode(false);setCameraScore(null);setEditingRound(null);setScoringFor(name);navigate("counter");}} style={{...btnStyle(`linear-gradient(135deg, ${C.sky}, ${C.teal})`),padding:"8px 12px",fontSize:12,borderRadius:10}}>SCORE</button>
                      : isHost&&!allowHost
                        ? <div style={{fontSize:10,color:"#ccc",fontWeight:600,textAlign:"center",lineHeight:1.3}}>🔒<br/>locked</div>
                        : <div style={{fontSize:11,color:"#ccc",fontWeight:600}}>waiting…</div>
                  }
                </div>
              </div>
            );
          })}
          {/* Legend */}
          <div style={{textAlign:"center",padding:"8px 4px 4px",fontSize:12,color:C.muted,fontWeight:600}}>
            lower score wins · rounds scored out of {startPip}
          </div>
        </div>
        {/* Always-visible bottom bar */}
        <div style={{paddingBottom:"calc(12px + env(safe-area-inset-bottom))",paddingTop:12,paddingLeft:"max(14px, env(safe-area-inset-left))",paddingRight:"max(14px, env(safe-area-inset-right))",background:"rgba(242,244,248,0.97)",borderTop:"1px solid rgba(0,0,0,0.05)",boxSizing:"border-box",width:"100%",flexShrink:0}}>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>navigate("fullboard")} style={{flex:1,padding:"13px",borderRadius:14,border:"2px solid #e8e8e8",background:"#fff",color:C.dark,fontWeight:800,fontSize:14,cursor:"pointer",minHeight:48,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              <IconGrid size={18} color={C.dark}/> Scoreboard
            </button>
            <button onClick={()=>{setRulesFrom('scorecard');setRulesTab('deal');navigate("rules");}} style={{padding:"13px 16px",borderRadius:14,border:"2px solid #e8e8e8",background:"#fff",color:C.teal,fontWeight:800,fontSize:13,cursor:"pointer",minHeight:48,display:"flex",alignItems:"center",justifyContent:"center",gap:6,whiteSpace:"nowrap"}}>
              <IconRules size={16} color={C.teal}/> Rules
            </button>
            <button onClick={()=>resetNav("splash")} style={{padding:"13px 16px",borderRadius:14,border:"2px solid #e8e8e8",background:"#fff",color:C.coral,fontWeight:800,fontSize:13,cursor:"pointer",minHeight:48,display:"flex",alignItems:"center",justifyContent:"center",gap:6,whiteSpace:"nowrap"}}>
              <IconRefresh size={16} color={C.coral}/> Leave
            </button>
          </div>
        </div>
      </div>
    );
  }

  // ── COUNTER ────────────────────────────────────────────────────────────────
  if(screen==="counter"&&gameData){
    const targetPlayer = scoringFor || myName;
    const targetRound = editingRound !== null ? editingRound : currentRound;
    const existingScore = editingRound !== null ? getRound(targetPlayer, editingRound) : null;
    const score=cameraScore!==null?cameraScore:calcScore();
    const tiles=Array.from({length:startPip+1},(_,i)=>i);
    const pIdx=players.indexOf(targetPlayer);
    const scoringForOther=targetPlayer!==myName;
    return(
      <Screen style={{background:C.bg}}>
        <div style={{background:`linear-gradient(135deg, ${AVATAR_BG[pIdx%AVATAR_BG.length]}cc, #FF70A6)`,padding:"calc(env(safe-area-inset-top) + 18px) 18px 18px",display:"flex",alignItems:"center",gap:13}}>
          <button onClick={()=>{setEditingRound(null);setScoringFor("");goBack();}} style={{background:"rgba(255,255,255,0.22)",border:"none",color:"#fff",width:40,height:40,borderRadius:"50%",fontSize:18,cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
          <div onClick={()=>goToProfile(targetPlayer)} style={{flexShrink:0,cursor:"pointer"}}><Avatar name={targetPlayer} {...avatarProps(targetPlayer,pIdx)} size={48}/></div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{color:"rgba(255,255,255,0.75)",fontSize:11,fontWeight:700,display:"flex",alignItems:"center",gap:6}}>
              Round {targetRound} · scoring for
              {editingRound!==null&&<span style={{background:"rgba(255,255,255,0.25)",borderRadius:50,padding:"2px 8px",fontSize:10,fontWeight:800,letterSpacing:0.5}}>EDITING</span>}
              {scoringForOther&&<span style={{background:`${C.coral}55`,borderRadius:50,padding:"2px 8px",fontSize:10,fontWeight:800,letterSpacing:0.5}}>HOST</span>}
            </div>
            <div style={{color:"#fff",fontWeight:900,fontSize:20,fontFamily:"'Fredoka One',cursive",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{targetPlayer}</div>
          </div>
          <div style={{textAlign:"right",flexShrink:0}}>
            {editingRound!==null&&existingScore!==null&&<div style={{color:"rgba(255,255,255,0.55)",fontSize:10,fontWeight:700,textDecoration:"line-through"}}>{existingScore}</div>}
            <div style={{color:"rgba(255,255,255,0.65)",fontSize:10,fontWeight:700}}>PIPS</div>
            <div style={{fontFamily:"'Fredoka One',cursive",color:"#fff",fontSize:"clamp(38px,11vw,52px)",lineHeight:1}}>{score}</div>
          </div>
        </div>
        <ColorBar colors={skin.bar}/>
        <div style={{display:"flex",margin:"12px 12px 0",background:"#fff",borderRadius:14,padding:4,boxShadow:"0 2px 10px rgba(0,0,0,0.06)"}}>
          {[["Tap Tiles",false],["Camera AI",true]].map(([label,cam])=>(
            <button key={label} onClick={()=>{setCameraMode(cam);if(!cam)setCameraScore(null);}} style={{flex:1,padding:"11px 0",borderRadius:11,border:"none",cursor:"pointer",minHeight:46,background:cameraMode===cam?`linear-gradient(135deg, ${C.coral}, ${C.pink})`:"transparent",color:cameraMode===cam?"#fff":C.muted,fontWeight:800,fontSize:"clamp(13px,3.5vw,15px)",fontFamily:"'Nunito',sans-serif",display:"flex",alignItems:"center",justifyContent:"center",gap:7}}>
              {cam?<IconCamera size={18} color={cameraMode===cam?"#fff":C.muted}/>:<IconFinger size={18} color={cameraMode===cam?"#fff":C.muted}/>}
              {label}
            </button>
          ))}
        </div>
        {cameraMode&&(
          <div style={{margin:"12px 12px 0",background:skin.cardBg||"#fff",borderRadius:20,padding:20,textAlign:"center",boxShadow:"0 2px 12px rgba(0,0,0,0.06)"}}>
            {!isPro?(
              <>
                <div style={{width:64,height:64,borderRadius:16,background:`${C.gold}18`,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px"}}><IconCamera size={36} color={C.gold}/></div>
                <span style={{background:`linear-gradient(135deg, ${C.gold}, ${C.coral})`,color:C.dark,borderRadius:50,padding:"3px 12px",fontSize:11,fontWeight:900,fontFamily:"'Nunito',sans-serif"}}>★ Game Night+ feature</span>
                <div style={{fontFamily:"'Fredoka One',cursive",fontSize:20,color:C.dark,marginTop:10,marginBottom:6}}>AI Pip Counting</div>
                <div style={{fontSize:13,color:C.muted,marginBottom:18,lineHeight:1.55}}>Point your camera at your remaining tiles and let AI count the pips instantly. Available with Game Night+.</div>
                <button onClick={()=>{setUpgradeFrom('counter');navigate('upgrade');}} style={{...btnStyle(`linear-gradient(135deg, ${C.gold}, ${C.coral})`),width:"100%",fontSize:15,padding:"14px",borderRadius:50,color:C.dark,fontWeight:900,marginBottom:10}}>★ Upgrade to Game Night+ · $3.99</button>
                <button onClick={()=>setCameraMode(false)} style={{background:"none",border:`1.5px solid ${C.muted}44`,color:C.muted,borderRadius:50,padding:"11px",width:"100%",fontSize:14,fontWeight:700,fontFamily:"'Nunito',sans-serif",cursor:"pointer"}}>Use manual counting instead</button>
              </>
            ):(
              <>
                <div style={{display:"flex",justifyContent:"center",marginBottom:8}}><IconCamera size={48} color={C.teal}/></div>
                <div style={{fontWeight:800,color:C.dark,marginBottom:6,fontSize:16}}>Photo your remaining tiles</div>
                <div style={{fontSize:13,color:C.muted,marginBottom:16}}>AI will count all the pips automatically</div>
                <input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={handlePhoto} style={{display:"none"}}/>
                <button onClick={()=>fileRef.current.click()} style={{...btnStyle(`linear-gradient(135deg, ${C.sky}, ${C.teal})`),width:"100%",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                  <IconCamera size={20} color="#fff"/> Take Photo
                </button>
                {cameraLoading&&<div style={{marginTop:16,color:C.teal,fontWeight:700,fontSize:15}}>Counting pips…</div>}
                {cameraError&&<div style={{marginTop:12,color:C.coral,fontSize:13,fontWeight:700}}>{cameraError}</div>}
                {cameraScore!==null&&(
                  <div style={{marginTop:14,padding:"14px 16px",background:`${C.lime}33`,borderRadius:14}}>
                    <div style={{fontSize:11,color:C.muted,fontWeight:800,textTransform:"uppercase",letterSpacing:1}}>AI Counted</div>
                    <div style={{fontFamily:"'Fredoka One',cursive",fontSize:56,color:C.teal,lineHeight:1}}>{cameraScore}</div>
                    <div style={{fontSize:12,color:C.muted}}>pips total</div>
                  </div>
                )}
              </>
            )}
          </div>
        )}
        {!cameraMode&&(
          <div style={{margin:"12px 12px 0",background:skin.cardBg||"#fff",borderRadius:20,padding:14,boxShadow:"0 2px 12px rgba(0,0,0,0.06)"}}>
            <div style={{fontSize:11,fontWeight:800,color:C.muted,textAlign:"center",textTransform:"uppercase",letterSpacing:1.5,marginBottom:12}}>Tap to add · tap again to increase count · tap at 13 to reset</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill, minmax(70px, 1fr))",gap:8,justifyItems:"center"}}>
              {tiles.map(val=>(
                <Domino key={val} value={val} size={70}
                  selected={(selected[val]||0)>0}
                  count={selected[val]||0}
                  onClick={()=>toggleDomino(val)}
                />
              ))}
            </div>
            {Object.entries(selected).some(([,c])=>c>0)&&(
              <div style={{marginTop:12,padding:"9px 14px",background:"#f7f8fa",borderRadius:10,fontSize:13,color:C.muted,textAlign:"center"}}>
                {Object.entries(selected).filter(([,c])=>c>0).map(([v,c])=>`${c}×[${Number(v)===0?"50pts":v}]`).join(" + ")} = <strong style={{color:C.dark}}>{score}</strong>
              </div>
            )}
          </div>
        )}
        <BottomBar>
          <div style={{background:"#fff",borderRadius:18,padding:"12px 14px",boxShadow:"0 2px 12px rgba(0,0,0,0.07)",boxSizing:"border-box",width:"100%"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
              <div style={{fontSize:11,color:C.muted,fontWeight:700,textTransform:"uppercase",letterSpacing:1}}>Round Score</div>
              <div style={{fontFamily:"'Fredoka One',cursive",fontSize:36,color:C.dark,lineHeight:1}}>{score}</div>
            </div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>setSelected({})} style={{flex:1,padding:"14px 0",borderRadius:50,border:"none",background:"#f0f0f0",color:C.muted,fontSize:14,fontWeight:800,fontFamily:"'Nunito',sans-serif",cursor:"pointer"}}>CLEAR</button>
              <button onClick={()=>submitScore(score)} style={{flex:2,padding:"14px 0",borderRadius:50,border:"none",background:`linear-gradient(135deg, ${C.coral}, ${C.pink})`,color:"#fff",fontSize:16,fontWeight:800,fontFamily:"'Nunito',sans-serif",cursor:"pointer",boxShadow:`0 6px 22px ${C.pink}44`,letterSpacing:1}}>{editingRound!==null?"UPDATE":"SUBMIT"}</button>
            </div>
          </div>
        </BottomBar>
      </Screen>
    );
  }

  // ── GAME OVER ──────────────────────────────────────────────────────────────
  if(screen==="gameover"&&gameData){
    const rank=ranked;
    return(
      <Screen style={{background:`linear-gradient(160deg, ${C.dark} 0%, #2a1a3a 100%)`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"40px 24px",textAlign:"center"}}>
        <div style={{fontSize:64,marginBottom:8}}>🎉</div>
        <div style={{fontFamily:"'Fredoka One',cursive",fontSize:38,color:C.gold,lineHeight:1,marginBottom:4}}>Game Over!</div>
        <div style={{color:"rgba(255,255,255,0.6)",fontSize:16,marginBottom:32}}>Final Results</div>
        {rank.map((name,i)=>(
          <div key={name} style={{width:"100%",maxWidth:360,display:"flex",alignItems:"center",gap:14,padding:"14px 18px",marginBottom:10,borderRadius:20,background:i===0?"rgba(255,215,0,0.15)":"rgba(255,255,255,0.07)",border:i===0?`2px solid ${C.gold}44`:"1px solid rgba(255,255,255,0.09)"}}>
            <div style={{fontFamily:"'Fredoka One',cursive",fontSize:28,color:i===0?C.gold:"rgba(255,255,255,0.3)",width:32}}>{i===0?"🏆":i+1}</div>
            <div onClick={()=>goToProfile(name)} style={{flexShrink:0,cursor:"pointer"}}><Avatar name={name} {...avatarProps(name,players.indexOf(name))} size={44}/></div>
            <div style={{flex:1,textAlign:"left"}}>
              <div style={{color:"#fff",fontWeight:800,fontSize:17}}>{name}{name===myName&&<span style={{color:C.sky,fontSize:12}}> (you)</span>}</div>
              <div style={{color:"rgba(255,255,255,0.5)",fontSize:12}}>{getWins(name)} rounds won</div>
            </div>

              </tr>

            <tbody>
              {players.map((name,pi)=>{

                  <tr key={name} style={{background:pi%2===0?"rgba(255,255,255,0.025)":"transparent"}}>

                        <td key={pip} style={{padding:"7px 3px",textAlign:"center"}}>
                          {s!==null
                            ?<div
                                onClick={isMyScore?()=>{setSelected({});setCameraMode(false);setCameraScore(null);setEditingRound(pip);setScoringFor(name);navigate("counter");}:undefined}

                          }
                        </td>

                    })}
                    <td style={{padding:"7px 6px",textAlign:"center",fontFamily:"'Fredoka One',cursive",color:rk===1?C.gold:C.coral,fontSize:16}}>{rk}</td>
                    <td style={{padding:"7px 6px",textAlign:"center",fontFamily:"'Fredoka One',cursive",color:"#fff",fontSize:18}}>{total}</td>

              <tr style={{borderTop:"1px solid rgba(255,255,255,0.09)"}}>

            </tbody>

        </div>
      </Screen>

  // ── WELCOME ────────────────────────────────────────────────────────────────
  if(screen==="welcome"){
    const canSubmit=welcomeName.trim().length>0;
    async function saveProfile(){
      if(!canSubmit||!currentUser) return;
      const name=welcomeName.trim();
      const profile={
        name,avatarIdx:welcomeAvatar,createdAt:Date.now(),
        email:null,isPro:false,gamesPlayed:0,wins:0,totalScore:0,gameHistory:[],
      };
      await fb.set(fb.ref(fb.db,`profiles/${currentUser.uid}`),profile);
      setUserProfile(profile);
      setMyName(name);
      // Retroactive claim — if they came from a completed game, write results now
      if(pendingClaimGame){
        const snap=await fb.get(fb.ref(fb.db,`games/${pendingClaimGame}`));
        if(snap.exists()){
          const gd=snap.val();
          // Find which player slot matches their chosen name (best-effort)
          const matchedName=(gd.players??[]).find(p=>p.toLowerCase()===name.toLowerCase())||null;
          if(matchedName){
            const updates={};
            updates[`games/${pendingClaimGame}/playerUids/${matchedName}`]=currentUser.uid;
            await fb.update(fb.ref(fb.db),updates);
            await writeGameResults({...gd,playerUids:{...gd.playerUids,[matchedName]:currentUser.uid}});
          }
        }
        setPendingClaimGame(null);
      }
      resetNav("splash");
    }
    return(
      <Screen style={{background:`linear-gradient(160deg, ${C.dark} 0%, #2a1a3a 100%)`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"40px 24px",textAlign:"center"}}>

        <div style={{color:"rgba(255,255,255,0.5)",fontSize:15,marginBottom:32}}>Let's set up your player profile</div>
        <div style={{display:"flex",gap:10,marginBottom:28,justifyContent:"center",flexWrap:"wrap"}}>
          {AVATAR_BG.map((bg,i)=>(
            <div key={i} onClick={()=>setWelcomeAvatar(i)} style={{width:44,height:44,borderRadius:"50%",background:bg,cursor:"pointer",border:welcomeAvatar===i?"3px solid #fff":"3px solid transparent",boxShadow:welcomeAvatar===i?"0 0 0 2px rgba(255,255,255,0.5)":"none",transition:"all 0.15s"}}/>
          ))}

          <input
            value={welcomeName}
            onChange={e=>setWelcomeName(e.target.value)}
            placeholder="Your name"
            style={{width:"100%",padding:"16px",borderRadius:16,border:"2px solid rgba(255,255,255,0.2)",background:"rgba(255,255,255,0.08)",color:"#fff",fontSize:18,fontFamily:"'Nunito',sans-serif",outline:"none",textAlign:"center",boxSizing:"border-box"}}
            onKeyDown={e=>e.key==="Enter"&&saveProfile()}
          />
        </div>
        <button onClick={()=>{setUpgradeFrom('welcome');navigate('upgrade');}} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 14px",borderRadius:12,background:`${C.gold}18`,border:"none",cursor:"pointer",marginBottom:28}}>

          <span style={{color:C.gold,fontSize:13,fontWeight:700,fontFamily:"'Nunito',sans-serif"}}>Game Night+ saves your stats forever —</span>

        </button>
        <button onClick={saveProfile} disabled={!canSubmit} style={{...btnStyle(canSubmit?`linear-gradient(135deg, ${C.teal}, #1a5f82)`:"#555"),width:"100%",maxWidth:320,fontSize:18,padding:"17px",borderRadius:50,opacity:canSubmit?1:0.5,cursor:canSubmit?"pointer":"not-allowed"}}>

      <Screen style={{background:C.bg,display:"flex",flexDirection:"column",height:"100dvh",overflow:"hidden"}}>

                    </div>
                    <button onClick={e=>{e.stopPropagation();setEditingSquad({...sq});navigate('squadedit');}} style={{background:`${C.sky}18`,border:`1px solid ${C.sky}55`,borderRadius:8,padding:"6px 12px",cursor:"pointer",color:C.teal,fontSize:12,fontWeight:800,fontFamily:"'Nunito',sans-serif",flexShrink:0}}>Edit</button>
                  </div>
                );
              })}
              <button onClick={()=>{const ns={id:Date.now(),name:"New Squad",members:[],lastPlayed:null};setEditingSquad(ns);navigate('squadedit');}} style={{width:"100%",padding:"14px",borderRadius:14,border:`2px dashed ${C.teal}88`,background:`${C.teal}08`,color:C.teal,fontSize:14,fontWeight:800,fontFamily:"'Nunito',sans-serif",cursor:"pointer",marginTop:4}}>+ New Squad</button>
            </div>
          )}

          {/* ── PLAYERS TAB ── */}
          {squadsTab==='players'&&(
            <div>
              <div style={{fontSize:11,fontWeight:800,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:2}}>All players</div>
              <div style={{fontSize:12,color:C.muted,marginBottom:14}}>Tap a player to view stats or edit their profile</div>
              {allPlayers.length===0&&(
                <div style={{textAlign:"center",padding:"32px 16px",color:C.muted,fontSize:14}}>No players yet. Add one below!</div>

              {allPlayers.map((pl,i)=>{
                const plSquads=squads.filter(s=>s.members?.includes(pl.name));

                  <div key={pl.id||i} onClick={()=>goToProfile(pl.name)} style={{background:"#fff",borderRadius:16,padding:"12px 16px",marginBottom:10,display:"flex",alignItems:"center",gap:12,boxShadow:"0 2px 8px rgba(0,0,0,0.05)",cursor:"pointer"}}>
                    <Avatar name={pl.name} idx={pl.avatarIdx??i} size={44} emoji={pl.avatarEmoji||null} photo={pl.avatarPhoto||null} color={pl.avatarColor||null}/>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:800,fontSize:16,color:C.dark}}>{pl.name}</div>
                      <div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:3}}>
                        {plSquads.map(s=><Badge key={s.id} label={s.name} bg={C.sky}/>)}

                    <div style={{textAlign:"right",flexShrink:0}}>
                      <div style={{fontSize:12,color:C.muted}}>{pl.wins||0}W · avg {pl.gamesPlayed>0?Math.round((pl.totalScore||0)/pl.gamesPlayed):0}</div>

                    onKeyDown={function(e){
                      if(e.key==="Enter"&&newPlayerName.trim()){
                        var np={id:Date.now(),name:newPlayerName.trim(),avatarIdx:allPlayers.length%AVATAR_BG.length,wins:0,gamesPlayed:0,totalScore:0,gameHistory:[]};

                      }
                      if(e.key==="Escape"){setAddingPlayer(false);setNewPlayerName("");}
                    }}

              )}
            </div>
          )}
        </div>

        {squadsTab==='squads'&&(
